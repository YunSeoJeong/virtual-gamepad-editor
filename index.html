<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Virtual Gamepad Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --bg-2: #ffffff;
  --bg-3: #f1f5f9;
  --panel: #ffffff;
  --panel-soft: #fbfdff;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #1e293b;
  --text-dim: #64748b;
  --text-mute: #94a3b8;
  --accent: #2563eb;
  --accent-2: #38bdf8;
  --accent-soft: #dbeafe;
  --kb: #0284c7;
  --pad: #8b5cf6;
  --danger: #ef4444;
  --danger-soft: #fee2e2;
  --ok: #10b981;
  --warn: #f59e0b;

  --shadow-1: 0 1px 0 rgba(255,255,255,0.95) inset, 0 8px 24px rgba(15,23,42,0.08);
  --shadow-2: 0 18px 48px rgba(15,23,42,0.12);
  --grid: rgba(148,163,184,0.28);
}

* { box-sizing: border-box; }

img,
svg,
video {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  max-width: 100%;
  min-width: 0;
}

button,
[role="button"] {
  -webkit-touch-callout: none;
}

html, body {
  margin: 0; padding: 0;
  height: 100%;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  font-size: 13px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
body.modal-open { overflow: hidden; }

button { font-family: inherit; }
button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
input, select, textarea { -webkit-user-select: text; user-select: text; }

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid rgba(37, 99, 235, 0.42);
  outline-offset: 2px;
}

button:disabled,
input:disabled,
select:disabled,
textarea:disabled,
[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.48;
}

button:disabled,
[aria-disabled="true"] {
  pointer-events: none;
}

/* ===================== LAYOUT ===================== */
.app {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 300px;
  grid-template-rows: calc(48px + env(safe-area-inset-top)) 1fr calc(28px + env(safe-area-inset-bottom));
  height: 100dvh;
  width: 100vw;
  max-width: 100vw;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  overflow: hidden;
}

.topbar {
  grid-column: 1 / 4;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: env(safe-area-inset-top) 14px 0;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}

.brand {
  font-weight: 700;
  letter-spacing: 0.02em;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: 6px;
}
.brand-dot {
  width: 10px; height: 10px;
  flex: 0 0 10px;
  aspect-ratio: 1 / 1;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 2px;
  transform: rotate(45deg);
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.tb-divider {
  width: 1px; height: 24px;
  background: var(--border);
  margin: 0 4px;
}

.tb-btn {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  min-height: 32px;
  white-space: nowrap;
  touch-action: manipulation;
}
.tb-btn:hover { background: var(--bg-3); border-color: var(--border-strong); }
.tb-btn:active {
  background: var(--accent-soft);
  border-color: var(--accent);
  transform: translateY(1px);
}
.tb-btn.primary {
  background: linear-gradient(180deg, var(--accent), #1d4ed8);
  color: #ffffff;
  border-color: transparent;
  font-weight: 600;
}
.tb-btn.primary:hover { filter: brightness(1.08); }
.tb-btn.danger { color: var(--danger); }
#btn-bg-clear { min-width: 32px; justify-content: center; }

.tb-spacer { flex: 1; }

.tb-select, .tb-input {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
  min-height: 32px;
}
.tb-input { width: 80px; }

/* Sidebar (palette) */
.sidebar-left {
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 14px 12px;
  min-width: 0;
}

.section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-mute);
  margin: 4px 0 10px 4px;
}

.palette {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
  min-width: 0;
}
.palette-item {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px 8px;
  cursor: grab;
  text-align: center;
  transition: all 0.15s;
  font-size: 11px;
  color: var(--text-dim);
  min-height: 76px;
  min-width: 0;
  overflow: hidden;
  touch-action: manipulation;
}
.palette-item:hover {
  border-color: var(--accent);
  background: var(--bg-3);
  color: var(--text);
  transform: translateY(-1px);
}
.palette-item:active {
  border-color: var(--accent);
  background: var(--accent-soft);
  transform: scale(0.98);
}
.palette-item.is-armed {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}
.palette-item.dragging { opacity: 0.5; }
.palette-item.mouse-region-item {
  border-color: #fecaca;
  color: var(--danger);
}
.palette-item.mouse-region-item:hover {
  border-color: var(--danger);
}
.palette-icon {
  width: 36px; height: 36px;
  aspect-ratio: 1 / 1;
  margin: 0 auto 4px;
  display: flex; align-items: center; justify-content: center;
}
.palette-icon svg { width: 100%; height: 100%; }

/* Canvas */
.canvas-wrap {
  position: relative;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 20px 20px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 20px 20px,
    radial-gradient(ellipse at center, #ffffff 0%, #f1f5f9 72%, #eaf0f8 100%);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  min-width: 0;
  min-height: 0;
}
.canvas-wrap.is-pan-mode { cursor: grab; }
.canvas-wrap.is-panning { cursor: grabbing; }
.canvas-wrap:focus-visible {
  outline: 3px solid rgba(37, 99, 235, 0.42);
  outline-offset: -3px;
}
.canvas-wrap.palette-armed {
  cursor: crosshair;
}

.canvas-frame {
  position: relative;
  flex: 0 0 auto;
  will-change: transform;
  background: #ffffff;
  box-shadow: var(--shadow-2), 0 0 0 1px var(--border-strong);
  /* size set by JS based on resolution and zoom */
}

.canvas-bg-image {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  pointer-events: none;
  opacity: 0.6;
}

.canvas-overlay {
  position: absolute; inset: 0;
  pointer-events: auto;
}

/* Snap guidelines */
.guide {
  position: absolute;
  background: var(--accent);
  pointer-events: none;
  z-index: 100;
  box-shadow: 0 0 4px var(--accent);
}
.guide.h { height: 1px; left: 0; right: 0; }
.guide.v { width: 1px; top: 0; bottom: 0; }

/* Components on canvas */
.gp-component {
  position: absolute;
  touch-action: none;
  cursor: move;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #cbd5e1;
  background: rgba(255, 255, 255, 0.94);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  user-select: none;
  backdrop-filter: blur(2px);
  transition: border-color 0.12s, box-shadow 0.12s;
}
.gp-component.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.18), 0 10px 26px rgba(37,99,235,0.20);
  z-index: 50;
}
.gp-component:focus-visible,
.mouse-region:focus-visible {
  outline: 3px solid rgba(37, 99, 235, 0.58);
  outline-offset: 3px;
}
.gp-component.locked { opacity: 0.65; cursor: not-allowed; }

.gp-component.shape-circle { border-radius: 50%; }
.gp-component.shape-pill { border-radius: 999px; }
.gp-component.shape-square { border-radius: 8px; }
.gp-component.shape-region { border-style: dashed; background: #f0f9ff; }

/* Color hint by input type */
.gp-component[data-input-type="keyboard"] { border-color: #7dd3fc; }
.gp-component[data-input-type="controller"] { border-color: #c4b5fd; }
.gp-component.selected[data-input-type] { border-color: var(--accent); }

/* Handles */
.gp-component .resize-handle,
.mouse-region .resize-handle {
  position: absolute;
  width: 12px; height: 12px;
  background: var(--accent);
  border: 1.5px solid #ffffff;
  border-radius: 2px;
  z-index: 60;
  touch-action: none;
}
.gp-component .resize-handle::before,
.mouse-region .resize-handle::before {
  content: '';
  position: absolute;
  inset: -6px;
}
.gp-component .resize-handle.se, .mouse-region .resize-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
.gp-component .resize-handle.sw, .mouse-region .resize-handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
.gp-component .resize-handle.ne, .mouse-region .resize-handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
.gp-component .resize-handle.nw, .mouse-region .resize-handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }

/* Mouse-ignore visualization */
.gp-component.mouse-ignore {
  background-image:
    repeating-linear-gradient(
      45deg,
      rgba(239, 68, 68, 0.14) 0,
      rgba(239, 68, 68, 0.14) 6px,
      transparent 6px,
      transparent 12px
    );
}
.gp-component .badge {
  position: absolute;
  top: -8px; left: -2px;
  font-size: 9px;
  padding: 1px 5px;
  background: var(--bg-3);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}
.gp-component .badge.kb { color: var(--kb); border-color: var(--kb); }
.gp-component .badge.pad { color: var(--pad); border-color: var(--pad); }

/* Selection box for marquee */
.marquee {
  position: absolute;
  border: 1px dashed var(--accent);
  background: rgba(37,99,235,0.08);
  pointer-events: none;
  z-index: 90;
}

/* Sidebar (inspector) */
.sidebar-right {
  background: var(--panel);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 14px 12px;
  min-width: 0;
}

.field {
  margin-bottom: 12px;
}
.field-label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-mute);
  margin-bottom: 5px;
  font-weight: 600;
}
.field-row { display: flex; gap: 6px; }
.field-row > * { min-width: 0; }
.field-row .tb-input { flex: 1; width: auto; }

.input-text, .input-num, .input-select {
  width: 100%;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 5px;
  font-size: 12px;
  font-family: inherit;
  min-height: 32px;
}
.input-text:focus, .input-num:focus, .input-select:focus {
  outline: none;
  border-color: var(--accent);
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 12px;
  padding: 4px 0;
  color: var(--text-dim);
  min-height: 32px;
  touch-action: manipulation;
}
.checkbox input { accent-color: var(--accent); }
.checkbox input {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

.btn-group {
  display: flex;
  gap: 4px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px;
}
.btn-group button {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 5px 6px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  transition: all 0.12s;
  min-height: 30px;
  touch-action: manipulation;
}
.btn-group button:hover { color: var(--text); }
.btn-group button.active {
  background: var(--bg-3);
  color: var(--accent);
}

.empty-inspector {
  text-align: center;
  padding: 30px 10px;
  color: var(--text-mute);
  font-size: 12px;
  line-height: 1.6;
}

/* Statusbar */
.statusbar {
  grid-column: 1 / 4;
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  padding-bottom: env(safe-area-inset-bottom);
  gap: 14px;
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}
.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok);
}

/* Resolution tabs */
.res-tabs {
  display: flex;
  gap: 2px;
  background: var(--bg-2);
  border-radius: 6px;
  padding: 2px;
  border: 1px solid var(--border);
}
.res-tab {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  min-height: 30px;
  touch-action: manipulation;
}
.res-tab:hover { color: var(--text); }
.res-tab.active { background: var(--bg-3); color: var(--accent); }
.res-tab .x {
  margin-left: 6px;
  color: var(--text-mute);
  cursor: pointer;
}
.res-tab .x:hover { color: var(--danger); }
.res-list-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 44px;
  gap: 6px;
}
.res-list-row .res-select {
  width: 100%;
  justify-content: space-between;
  text-align: left;
}
.res-list-row .res-remove {
  width: 44px;
  min-width: 44px;
  padding: 0;
  justify-content: center;
}

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.18);
  display: none;
  align-items: center; justify-content: center;
  z-index: 1000;
  touch-action: none;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 20px;
  width: min(540px, calc(100vw - 24px));
  max-height: min(80dvh, 720px);
  overflow: auto;
  overflow-wrap: anywhere;
  box-shadow: var(--shadow-2);
  touch-action: pan-y;
}
.modal h2 {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 600;
}
.modal textarea {
  width: 100%;
  min-height: 280px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  resize: vertical;
}
.modal-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  margin-top: 12px;
}

/* Help icon tooltip */
.help-tip {
  display: inline-block;
  margin-left: 5px;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--bg-3);
  color: var(--text-mute);
  font-size: 9px;
  text-align: center;
  line-height: 13px;
  cursor: help;
  font-weight: 700;
}

/* Mouse-ignore region overlay */
.mouse-region {
  position: absolute;
  border: 2px dashed var(--danger);
  background: rgba(254, 226, 226, 0.68);
  pointer-events: auto;
  cursor: move;
}
.mouse-region.selected {
  border-color: var(--accent);
  background: rgba(219, 234, 254, 0.74);
}
.mouse-region .label {
  position: absolute;
  top: 4px; left: 6px;
  font-size: 10px;
  color: var(--danger);
  font-weight: 600;
  background: #ffffff;
  padding: 1px 5px;
  border-radius: 3px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* Subtle drag state */
.dragging-active * { cursor: grabbing !important; }

/* Resolution preset picker */
.res-presets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 10px;
}
.res-preset {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  text-align: left;
  font-family: 'JetBrains Mono', monospace;
  min-height: 38px;
  touch-action: manipulation;
}
.res-preset:hover { border-color: var(--accent); }
.res-tab-label {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  min-width: 0;
}
.res-tab-display {
  font-size: 9px;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.68;
}

.zoom-pill {
  display: flex; align-items: center; gap: 4px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px;
}
.zoom-pill button {
  background: transparent; border: none; color: var(--text);
  width: 26px; height: 26px; border-radius: 3px; cursor: pointer; font-size: 13px;
  touch-action: manipulation;
}
.zoom-pill button:hover { background: var(--bg-3); }
#btn-pan {
  width: auto;
  padding-inline: 8px;
  font-size: 11px;
}
.zoom-pill button:active,
.zoom-pill button[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
}
.zoom-pill .zoom-separator {
  width: 1px;
  height: 22px;
  background: var(--border);
  margin-inline: 2px;
}
.zoom-pill .val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text-dim);
  padding: 0 6px; min-width: 38px; text-align: center;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 40px; left: 50%;
  transform: translateX(-50%);
  background: var(--bg-3);
  border: 1px solid var(--border-strong);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text);
  box-shadow: var(--shadow-2);
  z-index: 2000;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  width: max-content;
  max-width: calc(100vw - 24px);
  overflow-wrap: anywhere;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* Visual key icon for input type */
.input-type-toggle {
  display: flex;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.input-type-toggle button {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 6px;
  cursor: pointer;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 34px;
  touch-action: manipulation;
}
.input-type-toggle button.active.kb { background: #e0f2fe; color: var(--kb); }
.input-type-toggle button.active.pad { background: #ede9fe; color: var(--pad); }

/* Polished white theme refinements */
.topbar, .sidebar-left, .sidebar-right, .statusbar {
  box-shadow: var(--shadow-1);
}
.palette-item, .tb-btn, .input-text, .input-num, .input-select, .res-preset, .zoom-pill, .btn-group {
  box-shadow: 0 1px 2px rgba(15,23,42,0.03);
}
.palette-item:hover, .tb-btn:hover, .res-preset:hover {
  box-shadow: 0 6px 16px rgba(15,23,42,0.08);
}
.canvas-frame {
  border-radius: 8px;
}
.gp-component {
  box-shadow: 0 4px 14px rgba(15,23,42,0.08);

    height: 24px;
    border-radius: 5px;
  }

  .gp-component .resize-handle::before,
  .mouse-region .resize-handle::before {
    inset: -10px;
  }

  .gp-component::after,
  .mouse-region::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: max(100%, 44px);
    height: max(100%, 44px);
    transform: translate(-50%, -50%);
    pointer-events: auto;

  .mouse-region .resize-handle.se { right: -13px; bottom: -13px; }
  .gp-component .resize-handle.sw,

  .gp-component .resize-handle.ne,

<div class="app">

    <div class="tb-divider"></div>

    <div class="toolbar-group toolbar-actions" role="group" aria-label="Project actions">

    <div class="tb-divider"></div>

    <div class="modal-actions">
      <button class="tb-btn" id="res-cancel">Cancel</button>
      <button class="tb-btn primary" id="res-add">Add</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".json,application/json" style="display:none;" />

/* ---------- Standardized binding code lists ----------
   Keyboard: W3C/MDN KeyboardEvent.code values (physical key position).
   Gamepad: W3C Gamepad API Standard Gamepad canonical order, exposed here as
            readable aliases plus index-based codes for unambiguous runtimes.
---------- */
const KEYBOARD_CODE_OPTIONS = [
  'Escape','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12','PrintScreen','ScrollLock','Pause',
  'Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal','Backspace',
  'Tab','KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash',
  'CapsLock','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote','Enter',
  'ShiftLeft','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash','ShiftRight',
  'ControlLeft','MetaLeft','AltLeft','Space','AltRight','MetaRight','ContextMenu','ControlRight',
  'Insert','Home','PageUp','Delete','End','PageDown','ArrowUp','ArrowLeft','ArrowDown','ArrowRight',
  'NumLock','NumpadDivide','NumpadMultiply','NumpadSubtract','Numpad7','Numpad8','Numpad9','NumpadAdd',
  'Numpad4','Numpad5','Numpad6','Numpad1','Numpad2','Numpad3','NumpadEnter','Numpad0','NumpadDecimal',

const CONTROLLER_BUTTON_OPTIONS = [

  'A','B','X','Y','LB','RB','LT','RT','Back','Start','Select','Menu','LeftStickButton','RightStickButton','LS','RS',
  'DPadUp','DPadDown','DPadLeft','DPadRight','Guide','Home',
  // Index-based canonical codes from the W3C standard layout.
  'Button0','Button1','Button2','Button3','Button4','Button5','Button6','Button7','Button8','Button9','Button10','Button11','Button12','Button13','Button14','Button15','Button16'
];

const CONTROLLER_AXIS_OPTIONS = [
  'LeftStickX','LeftStickY','RightStickX','RightStickY','Axis0','Axis1','Axis2','Axis3'
];

// Mouse: based on MouseEvent.button (0~4) and MouseEvent.buttons bitmask (1,2,4,8,16).
// Human-friendly names are exported by default, while index/mask aliases are offered for unambiguous runtimes.
const MOUSE_BUTTON_OPTIONS = [
  'MouseLeft','MouseMiddle','MouseRight','MouseBack','MouseForward',
  'MouseButton0','MouseButton1','MouseButton2','MouseButton3','MouseButton4'
];
const MOUSE_BUTTON_MASK_OPTIONS = [
  'MouseButtons1','MouseButtons2','MouseButtons4','MouseButtons8','MouseButtons16',
  'MouseMaskLeft','MouseMaskRight','MouseMaskMiddle','MouseMaskBack','MouseMaskForward'
];
const MOUSE_CODE_OPTIONS = [
  ...MOUSE_BUTTON_OPTIONS,
  ...MOUSE_BUTTON_MASK_OPTIONS,
  'MouseX','MouseY','MouseWheelX','MouseWheelY','MouseWheelUp','MouseWheelDown','MouseWheelLeft','MouseWheelRight'
];
const TOUCH_CODE_OPTIONS = ['TouchX','TouchY','TouchPress','Touch0X','Touch0Y','Touch1X','Touch1Y'];

function ensureDatalist(id, values) {
  let list = document.getElementById(id);
  if (!list) {
    list = document.createElement('datalist');
    list.id = id;
    document.body.appendChild(list);
  }
  list.innerHTML = '';
  [...new Set(values)].forEach(v => list.appendChild(el('option', { value: v })));
}

function buildBindingDatalists() {
  ensureDatalist('keyboard-code-list', KEYBOARD_CODE_OPTIONS);
  ensureDatalist('controller-button-list', CONTROLLER_BUTTON_OPTIONS);
  ensureDatalist('controller-axis-list', CONTROLLER_AXIS_OPTIONS);
  ensureDatalist('controller-any-list', [...CONTROLLER_BUTTON_OPTIONS, ...CONTROLLER_AXIS_OPTIONS]);
  ensureDatalist('mouse-button-list', MOUSE_BUTTON_OPTIONS);
  ensureDatalist('mouse-buttons-mask-list', MOUSE_BUTTON_MASK_OPTIONS);
  ensureDatalist('mouse-code-list', MOUSE_CODE_OPTIONS);
  ensureDatalist('touch-code-list', TOUCH_CODE_OPTIONS);
  ensureDatalist('input-code-list', [...KEYBOARD_CODE_OPTIONS, ...CONTROLLER_BUTTON_OPTIONS, ...CONTROLLER_AXIS_OPTIONS, ...MOUSE_CODE_OPTIONS, ...TOUCH_CODE_OPTIONS]);
}

function bindingListFor(c, path) {
  const inputType = c?.inputType || c?.runtime?.inputType || 'controller';
  if (path === 'binding.keys') return 'keyboard-code-list';
  if (path === 'binding.buttons') return inputType === 'mouse' ? 'mouse-button-list' : 'keyboard-code-list';
  if (path === 'binding.button' && inputType === 'mouse') return 'mouse-button-list';
  if (inputType === 'keyboard') return 'keyboard-code-list';
  if (inputType === 'mouse') return 'mouse-code-list';
  if (path === 'binding.axis' || path === 'binding.axisX' || path === 'binding.axisY') return 'controller-axis-list';
  if (path.startsWith('binding.') || path.startsWith('bindings.')) return inputType === 'controller' ? 'controller-button-list' : 'keyboard-code-list';
  if (path.includes('gestures.')) return 'input-code-list';
  return '';
}

/* ---------- State ---------- */
const SCHEMA_VERSION = '1.3';

const DISPLAY_TARGETS = {
  main: 'Main display',
  sub: 'Sub display'
};

function normalizeDisplayTarget(value) {
  return value === 'sub' || value === 'secondary' ? 'sub' : 'main';
}

function displayTargetLabel(value) {
  return DISPLAY_TARGETS[normalizeDisplayTarget(value)];
}

const state = {
  meta: { name: '', description: '', version: SCHEMA_VERSION },
  resolutions: [],            // [{ id, display, width, height, components: [], mouseRegions: [] }]
  activeResId: null,
  selectedIds: [],            // selected component ids
  zoom: 0.5,
  panX: 0,
  panY: 0,
  panMode: false,
  autoFit: true,
  bgImage: null,              // dataURL
  bgVisible: true,
  snap: { grid: true, elements: true, gridSize: 10 },
  dragGuides: { x: null, y: null },
  pendingPaletteType: null
};

let dragSession = null;
let spacePanActive = false;
let viewportGesture = null;
const viewportPointers = new Map();

let _idCounter = 1;
const newId = (prefix = 'c') => `${prefix}_${Date.now().toString(36)}_${(_idCounter++).toString(36)}`;
let _controlCounter = 1;
const newControlId = (prefix = 'field') => `${prefix}-${_controlCounter++}`;

/* ---------- DOM helpers ---------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const el = (tag, attrs = {}, children = []) => {
  const e = document.createElement(tag);
  if (tag === 'button' && !Object.prototype.hasOwnProperty.call(attrs, 'type')) e.type = 'button';
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'style') e.style.cssText = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'dataset') Object.assign(e.dataset, attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};

function toast(msg, type = 'ok') {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('error', type === 'error');
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Active resolution helpers ---------- */
function getActiveRes() {
  return state.resolutions.find(r => r.id === state.activeResId);
}
function getActiveComponents() {
  const r = getActiveRes();
  return r ? r.components : [];
}
function getActiveMouseRegions() {
  const r = getActiveRes();
  return r ? r.mouseRegions : [];
}

/* ---------- Initialization ---------- */
function init() {
  buildBindingDatalists();
  buildPalette();
  bindTopbar();
  bindModals();
  bindViewportControls();
  bindCanvas();
  bindKeyboard();
  bindAlignButtons();

  // First resolution by default
  if (state.resolutions.length === 0) {
    addResolution(1920, 1080);
  }
  renderAll();
  fitZoom();
}

/* ---------- Build palette ---------- */
function buildPalette() {
  const palette = $('#palette');
  palette.innerHTML = '';
  for (const [type, def] of Object.entries(COMPONENT_TYPES)) {
    const item = el('button', {
      type: 'button',
      class: 'palette-item' + (def.isMouseRegion ? ' mouse-region-item' : ''),
      title: def.description,
      'aria-label': `${def.label}: ${def.description}`,
      'aria-pressed': 'false',
      dataset: { type },
      draggable: 'true'
    }, [
      el('div', { class: 'palette-icon' }, []),
      def.label
    ]);
    item.querySelector('.palette-icon').innerHTML = PALETTE_ICONS[type] || '';
    item.addEventListener('click', () => setPendingPaletteType(type));
    item.addEventListener('dragstart', e => {
      clearPendingPalette();
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/component-type', type);
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    palette.appendChild(item);
  }
  updatePaletteArmedState();
}

function setPendingPaletteType(type) {
  state.pendingPaletteType = state.pendingPaletteType === type ? null : type;
  updatePaletteArmedState();
  const def = COMPONENT_TYPES[state.pendingPaletteType];
  $('#status-msg').textContent = def ? `${def.label}: tap canvas to place` : 'Ready';
}

function clearPendingPalette() {
  state.pendingPaletteType = null;
  updatePaletteArmedState();
  const status = $('#status-msg');
  if (status) status.textContent = 'Ready';
}

function updatePaletteArmedState() {
  $$('.palette-item').forEach(item => {
    const armed = item.dataset.type === state.pendingPaletteType;
    item.classList.toggle('is-armed', armed);
    item.setAttribute('aria-pressed', String(armed));
  });
  const wrap = $('#canvas-wrap');
  if (wrap) wrap.classList.toggle('palette-armed', !!state.pendingPaletteType);
}

function canvasPointFromEvent(e) {
  const frame = $('#canvas-frame');
  const rect = frame.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / state.zoom,
    y: (e.clientY - rect.top) / state.zoom
  };
}

function placePendingPaletteAt(x, y) {
  const type = state.pendingPaletteType;
  if (!type) return false;
  clearPendingPalette();
  if (type === 'mouseRegion') {
    addMouseRegion(x, y);
  } else {
    addComponent(type, x, y);
  }
  return true;
}

/* ---------- Resolution management ---------- */
function addResolution(w, h, display = 'main', copyFromId = null) {
  const id = newId('res');
  const newRes = {
    id,
    display: normalizeDisplayTarget(display),
    width: w,
    height: h,
    components: [],
    mouseRegions: []
  };
  if (copyFromId) {
    const src = state.resolutions.find(r => r.id === copyFromId);
    if (src) {
      // Scale components proportionally
      const sx = w / src.width;
      const sy = h / src.height;
      newRes.components = src.components.map(c => ({
        ...JSON.parse(JSON.stringify(c)),
        id: newId('c'),
        x: Math.round(c.x * sx),
        y: Math.round(c.y * sy),
        w: Math.round(c.w * sx),
        h: Math.round(c.h * sy)
      }));
      newRes.mouseRegions = src.mouseRegions.map(r => ({
        ...JSON.parse(JSON.stringify(r)),
        id: newId('mr'),
        x: Math.round(r.x * sx),
        y: Math.round(r.y * sy),
        w: Math.round(r.w * sx),
        h: Math.round(r.h * sy)
      }));
    }
  }
  state.resolutions.push(newRes);
  state.activeResId = id;
  state.selectedIds = [];
  state.panX = 0;
  state.panY = 0;
  state.autoFit = true;
  renderAll();
  requestAnimationFrame(fitZoom);
}

function removeResolution(id) {
  if (state.resolutions.length <= 1) {
    toast('적어도 하나의 해상도는 있어야 합니다', 'error');
    return;
  }
  if (!confirm('이 해상도 레이아웃을 삭제하시겠습니까?')) return;
  state.resolutions = state.resolutions.filter(r => r.id !== id);
  if (state.activeResId === id) {
    state.activeResId = state.resolutions[0].id;
    state.selectedIds = [];
    state.panX = 0;
    state.panY = 0;
    state.autoFit = true;
  }
  renderAll();
  if (state.autoFit) requestAnimationFrame(fitZoom);
}

function switchResolution(id) {
  state.activeResId = id;
  state.selectedIds = [];
  state.panX = 0;
  state.panY = 0;
  state.autoFit = true;
  renderAll();
  requestAnimationFrame(fitZoom);
}

/* ---------- Render: resolution tabs ---------- */
function renderResolutionTabs() {
  const list = $('#res-list');
  list.innerHTML = '';
  state.resolutions.forEach(r => {
    const isActive = r.id === state.activeResId;
    const select = el('button', {
      type: 'button',
      class: 'tb-btn res-select' + (isActive ? ' primary' : ''),
      'aria-pressed': String(isActive),
      'aria-label': `${displayTargetLabel(r.display)} ${r.width} × ${r.height} 해상도 선택`,
      onclick: () => switchResolution(r.id)
    }, el('span', { class: 'res-tab-label' }, [
      el('span', {}, `${r.width}×${r.height}`),
      el('span', { class: 'res-tab-display' }, displayTargetLabel(r.display))
    ]));
    const remove = el('button', {
      type: 'button',
      class: 'tb-btn danger res-remove',
      title: '삭제',
      'aria-label': `${r.width} × ${r.height} 해상도 삭제`,
      onclick: () => removeResolution(r.id)
    }, '✕');
    list.appendChild(el('div', { class: 'res-list-row' }, [select, remove]));
  });
}

function renderResolutionSettings() {
  const wrap = $('#res-settings');
  const r = getActiveRes();
  if (!wrap) return;
  wrap.innerHTML = '';
  if (!r) return;

  const current = normalizeDisplayTarget(r.display);
  const select = el('select', {
    id: 'active-display',
    class: 'input-select',
    onchange: e => {
      const next = normalizeDisplayTarget(e.target.value);
      const exists = state.resolutions.some(other =>
        other.id !== r.id &&
        other.width === r.width &&
        other.height === r.height &&
        normalizeDisplayTarget(other.display) === next
      );
      if (exists) {
        toast('같은 해상도의 해당 디스플레이 설정이 이미 있습니다', 'error');
        e.target.value = current;
        return;
      }
      r.display = next;
      renderAll();
    }
  }, [
    el('option', { value: 'main', ...(current === 'main' ? { selected: 'selected' } : {}) }, 'Main display'),
    el('option', { value: 'sub', ...(current === 'sub' ? { selected: 'selected' } : {}) }, 'Sub display')
  ]);

  wrap.appendChild(el('div', { class: 'field', style: 'margin-bottom:0;' }, [
    el('label', { class: 'field-label', for: 'active-display' }, 'Active display'),
    select
  ]));
}

/* ---------- Render: canvas frame ---------- */
function renderCanvasFrame() {
  const r = getActiveRes();
  const frame = $('#canvas-frame');
  if (!r) return;
  frame.style.width = (r.width * state.zoom) + 'px';
  frame.style.height = (r.height * state.zoom) + 'px';
  applyCanvasViewportTransform();
  $('#status-res').textContent = `${displayTargetLabel(r.display)} · ${r.width} × ${r.height}`;
  $('#zoom-val').textContent = Math.round(state.zoom * 100) + '%';

  const bg = $('#canvas-bg');
  if (state.bgImage && state.bgVisible) {
    bg.src = state.bgImage;
    bg.style.display = 'block';
  } else {
    bg.style.display = 'none';
  }
}

function shouldShowResizeHandles(item) {
  if (!window.matchMedia('(any-pointer: coarse)').matches) return true;
  // Four 44px corner hit areas become ambiguous when the rendered item is
  // smaller than their separation. Users can zoom in or use numeric fields.
  return Math.min(item.w, item.h) * state.zoom >= 56;
}

/* ---------- Render: components ---------- */
function renderComponents() {
  const r = getActiveRes();
  const overlay = $('#canvas-overlay');
  overlay.innerHTML = '';
  if (!r) return;

  // mouse regions first (lower z)
  [...r.mouseRegions].sort((a,b)=>(a.z||0)-(b.z||0)).forEach(mr => {
    const div = el('div', {
      class: 'mouse-region' + (state.selectedIds.includes(mr.id) ? ' selected' : ''),
      dataset: { id: mr.id, kind: 'mouseRegion' },
      tabindex: '0',
      role: 'button',
      'aria-pressed': String(state.selectedIds.includes(mr.id)),
      'aria-label': `${mr.name || 'Mouse Region'}, ${mr.behavior === 'ignore' ? 'mouse ignore' : 'mouse pass-through'} 영역`,
      style: `left:${mr.x * state.zoom}px; top:${mr.y * state.zoom}px;
              width:${mr.w * state.zoom}px; height:${mr.h * state.zoom}px; z-index:${mr.z || 0};`
    }, [
      el('span', { class: 'label' }, `MOUSE ${mr.behavior === 'ignore' ? 'IGNORE' : 'PASS'}`),
      // resize handles for selected mouse regions
      ...(state.selectedIds.includes(mr.id) && shouldShowResizeHandles(mr)
        ? ['nw','ne','sw','se'].map(p => el('div', { class: `resize-handle ${p}` }))
        : [])
    ]);
    overlay.appendChild(div);
  });

  [...r.components].sort((a,b)=>((a.runtime?.z ?? a.z ?? 0)- (b.runtime?.z ?? b.z ?? 0))).forEach(c => {
    const def = COMPONENT_TYPES[c.type] || {};
    const shape = c.shape || def.shape || 'square';
    const div = el('div', {
      class: `gp-component shape-${shape} ${state.selectedIds.includes(c.id) ? 'selected' : ''} ${c.locked ? 'locked' : ''} ${c.mouseIgnore ? 'mouse-ignore' : ''}`,
      dataset: {
        id: c.id,
        kind: 'component',
        inputType: c.inputType || c.runtime?.inputType || 'controller'
      },
      tabindex: '0',
      role: 'button',
      'aria-pressed': String(state.selectedIds.includes(c.id)),
      'aria-label': `${def.label || c.type} ${c.label || ''}${c.locked ? ', 위치 잠김' : ''}`,
      style: `left:${c.x * state.zoom}px; top:${c.y * state.zoom}px;
              width:${c.w * state.zoom}px; height:${c.h * state.zoom}px;
              font-size:${Math.max(10, Math.min(c.w, c.h) * state.zoom * 0.22)}px;
              ${c.color ? `border-color:${c.color};` : ''}
              ${c.bg ? `background:${c.bg};` : ''}
              z-index:${c.runtime?.z ?? c.z ?? 0};`
    }, [
      el('span', { class: 'badge ' + (c.inputType === 'keyboard' ? 'kb' : 'pad') }, c.inputType === 'keyboard' ? 'KB' : (c.inputType === 'mouse' ? 'MOUSE' : 'PAD')),
      el('span', { class: 'label' }, c.label || ''),
      ...(state.selectedIds.includes(c.id) && !c.locked && shouldShowResizeHandles(c)
        ? ['nw','ne','sw','se'].map(p => el('div', { class: `resize-handle ${p}` }))
        : [])
    ]);
    overlay.appendChild(div);
  });

}

function renderAll() {
  renderResolutionTabs();
  renderResolutionSettings();
  renderCanvasFrame();
  renderComponents();
  renderInspector();
  $('#status-count').textContent = `${getActiveComponents().length} components, ${getActiveMouseRegions().length} regions`;
  $('#meta-name').value = state.meta.name || '';
  $('#meta-desc').value = state.meta.description || '';
}

/* ---------- Inspector ---------- */
function renderInspector() {
  const insp = $('#inspector');
  insp.innerHTML = '';

  if (state.selectedIds.length === 0) {
    insp.innerHTML = `<div class="empty-inspector">
      Select a component on the canvas<br />
      to edit its properties.<br /><br />
      <span style="color: var(--text-mute); font-size: 11px;">
        Drag from the palette to add new ones.<br/>
        Hold <b>Shift</b> for multi-select.<br/>
        <b>Del</b> to remove. <b>Ctrl+D</b> to duplicate.
      </span>
    </div>`;
    return;
  }

  if (state.selectedIds.length > 1) {
    insp.innerHTML = `<div class="section-title">${state.selectedIds.length} selected</div>
      <div class="empty-inspector" style="padding: 10px;">Use the alignment & distribute buttons in the left panel.</div>`;
    return;
  }

  const id = state.selectedIds[0];
  const isMouseRegion = id.startsWith('mr_');
  if (isMouseRegion) {
    renderMouseRegionInspector(id);
    return;
  }

  const c = getActiveComponents().find(x => x.id === id);
  if (!c) return;
  const def = COMPONENT_TYPES[c.type] || {};

  const wrap = el('div');
  wrap.appendChild(el('div', { class: 'section-title' }, `${def.label || c.type} • ${c.id.slice(-6)}`));

  normalizeComponentRuntime(c);

  // Input target
  const clickCapableTypes = ['button','key','combo','shoulder','trigger'];
  const inputOptions = c.type === 'mouseScroll'
    ? [['mouse','Mouse']]
    : ((c.type === 'touchpad' || clickCapableTypes.includes(c.type))
      ? [['controller','Controller'], ['keyboard','Keyboard'], ['mouse','Mouse']]
      : [['controller','Controller'], ['keyboard','Keyboard']]);
  wrap.appendChild(makeSelectField('Input target', c.inputType || c.runtime?.inputType || 'controller', inputOptions,
    v => { setComponentInputType(c, v); renderAll(); }));

  // Label
  wrap.appendChild(makeTextField('Label', c.label || '', v => { c.label = v; renderComponents(); }));

  renderRuntimeInspectorFields(wrap, c);

  // Position & size
  const posField = el('div', { class: 'field' }, [
    el('label', { class: 'field-label' }, 'Position & Size (px)')
  ]);
  posField.appendChild(makeNumGrid([

}

  const grid = el('div', { style: 'display:grid; grid-template-columns:1fr 1fr; gap:6px;' });
  items.forEach(it => {
    const id = newControlId('number-field');
    const wrap = el('div');
    wrap.appendChild(el('label', { for: id, style: 'display:block; font-size:10px; color:var(--text-mute); margin-bottom:2px;' }, it.label));
    wrap.appendChild(el('input', {
      id, type: 'number', class: 'input-num', value: it.val,
      onchange: e => it.on(parseFloat(e.target.value) || 0),
      oninput: e => it.on(parseFloat(e.target.value) || 0)
    }));
    grid.appendChild(wrap);
  });
  return grid;
}

/* ---------- Component CRUD ---------- */
function addComponent(type, x, y) {
  const def = COMPONENT_TYPES[type];
  if (!def) return;
  const r = getActiveRes();
  const c = {
    id: newId('c'),
    type,
    label: def.defaultLabel,
    inputType: def.inputType,
    binding: '',
    x: Math.round(x - def.defaultSize.w / 2),
    y: Math.round(y - def.defaultSize.h / 2),
    w: def.defaultSize.w,
    h: def.defaultSize.h,
    shape: def.shape,
    color: '',
    bg: '',
    mouseIgnore: type === 'touchpad' ? false : (def.inputType === 'controller' && type !== 'region'),
    locked: false
  };
  if (type === 'touchpad') { c.inputType = 'mouse'; }
  if (type === 'mouseScroll') { c.inputType = 'mouse'; c.mouseIgnore = false; }
  if (type === 'stick') { c.deadzone = 0.15; c.fixed = true; }
  if (type === 'trigger') { c.analog = c.inputType !== 'keyboard'; }
  normalizeComponentRuntime(c, true);
  r.components.push(c);
  state.selectedIds = [c.id];
  renderAll();
}

function addMouseRegion(x, y) {
  const r = getActiveRes();
  const mr = {
    id: newId('mr'),
    name: 'Mouse Region',
    behavior: 'ignore',
    x: Math.round(x - 100), y: Math.round(y - 100),
    w: 200, h: 200
  };
  r.mouseRegions.push(mr);
  state.selectedIds = [mr.id];
  renderAll();
}

function deleteSelected() {
  const r = getActiveRes();
  r.components = r.components.filter(c => !state.selectedIds.includes(c.id));
  r.mouseRegions = r.mouseRegions.filter(m => !state.selectedIds.includes(m.id));
  state.selectedIds = [];
  renderAll();
}
function duplicateSelected() {
  const r = getActiveRes();
  const newSel = [];
  state.selectedIds.forEach(id => {
    const c = r.components.find(x => x.id === id);
    if (c) {
      const copy = { ...JSON.parse(JSON.stringify(c)), id: newId('c'), x: c.x + 24, y: c.y + 24 };
      r.components.push(copy);
      newSel.push(copy.id);
    }
    const mr = r.mouseRegions.find(x => x.id === id);
    if (mr) {
      const copy = { ...JSON.parse(JSON.stringify(mr)), id: newId('mr'), x: mr.x + 24, y: mr.y + 24 };
      r.mouseRegions.push(copy);
      newSel.push(copy.id);
    }
  });
  state.selectedIds = newSel;
  renderAll();
}

/* ---------- Lightweight DOM updates during pointer interactions ---------- */
function refreshSelectionVisuals() {
  $$('#canvas-overlay .gp-component, #canvas-overlay .mouse-region').forEach(node => {
    node.classList.toggle('selected', state.selectedIds.includes(node.dataset.id));
  });
  renderInspector();
}

function updateCanvasNodePositions() {
  const z = state.zoom;
  const comps = getActiveComponents();
  const regions = getActiveMouseRegions();

  $$('#canvas-overlay .gp-component, #canvas-overlay .mouse-region').forEach(node => {
    const id = node.dataset.id;
    const o = comps.find(x => x.id === id) || regions.find(x => x.id === id);
    if (!o) return;

    node.style.left = (o.x * z) + 'px';
    node.style.top = (o.y * z) + 'px';
    node.style.width = (o.w * z) + 'px';
    node.style.height = (o.h * z) + 'px';

    if (node.classList.contains('gp-component')) {
      node.style.fontSize = Math.max(10, Math.min(o.w, o.h) * z * 0.22) + 'px';
    }
  });
}

function updateSelectionFromPointer(id, additive) {
  if (additive) {
    if (state.selectedIds.includes(id)) {
      state.selectedIds = state.selectedIds.filter(x => x !== id);
    } else {
      state.selectedIds = [...state.selectedIds, id];
    }
  } else if (!state.selectedIds.includes(id)) {
    state.selectedIds = [id];
  }
}

function getEditableObjectById(id) {
  const c = getActiveComponents().find(x => x.id === id);
  if (c) return c.locked ? null : c;
  return getActiveMouseRegions().find(x => x.id === id) || null;
}

function getSelectedEditableObjects() {
  return state.selectedIds
    .map(id => getEditableObjectById(id))
    .filter(Boolean);
}

function beginDragSession(primaryId) {
  const originals = new Map();
  getSelectedEditableObjects().forEach(o => {
    originals.set(o.id, { x: o.x, y: o.y });
  });
  dragSession = { primaryId, rawDx: 0, rawDy: 0, originals };
}

function moveSelectedDuringDrag(primaryId, dx, dy) {
  if (!dragSession || dragSession.primaryId !== primaryId) {
    beginDragSession(primaryId);
  }

  dragSession.rawDx += dx;
  dragSession.rawDy += dy;

  getSelectedEditableObjects().forEach(o => {
    const start = dragSession.originals.get(o.id);
    if (!start) return;
    o.x = start.x + dragSession.rawDx;
    o.y = start.y + dragSession.rawDy;
  });

  applyLiveSnapForSelection(primaryId);
}

function applyLiveSnapForSelection(primaryId) {
  const primary = getEditableObjectById(primaryId);
  if (!primary) return;

  let targetX = primary.x;
  let targetY = primary.y;

  if (state.snap.grid) {
    const g = Math.max(1, state.snap.gridSize || 1);
    targetX = Math.round(targetX / g) * g;
    targetY = Math.round(targetY / g) * g;
  }

  if (state.snap.elements) {
    const guide = computeGuideTarget(primary);
    if (guide.x !== null) targetX = guide.x;
    if (guide.y !== null) targetY = guide.y;
  }

  const correctionX = targetX - primary.x;
  const correctionY = targetY - primary.y;
  if (correctionX === 0 && correctionY === 0) return;

  getSelectedEditableObjects().forEach(o => {
    o.x += correctionX;
    o.y += correctionY;
  });
}

function moveSelected(dx, dy) {
  getSelectedEditableObjects().forEach(o => {
    o.x += dx;
    o.y += dy;
  });
}

function finalSnapForSelection() {
  const comps = getActiveComponents();
  const regions = getActiveMouseRegions();
  const targets = [...comps, ...regions].filter(x => state.selectedIds.includes(x.id));
  targets.forEach(o => {
    // Grid snap
    if (state.snap.grid) {
      const g = state.snap.gridSize;
      o.x = Math.round(o.x / g) * g;
      o.y = Math.round(o.y / g) * g;
    }
    // Element snap (handled via guides during move; final correction here)
    if (state.snap.elements) {
      const guide = computeGuideTarget(o);
      if (guide.x !== null) o.x = guide.x;
      if (guide.y !== null) o.y = guide.y;
    }
  });
}

const SNAP_THRESHOLD = 6; // canvas px
function computeGuideTarget(obj) {
  const result = { x: null, y: null };
  const others = [...getActiveComponents(), ...getActiveMouseRegions()]
    .filter(x => !state.selectedIds.includes(x.id));

  const objLines = {
    left: obj.x,
    right: obj.x + obj.w,
    cx: obj.x + obj.w / 2,
    top: obj.y,
    bottom: obj.y + obj.h,
    cy: obj.y + obj.h / 2
  };

  for (const o of others) {
    const v = [o.x, o.x + o.w, o.x + o.w / 2];
    const h = [o.y, o.y + o.h, o.y + o.h / 2];

    // x snapping
    for (const tx of v) {
      if (Math.abs(objLines.left - tx) < SNAP_THRESHOLD) { result.x = tx; break; }
      if (Math.abs(objLines.right - tx) < SNAP_THRESHOLD) { result.x = tx - obj.w; break; }
      if (Math.abs(objLines.cx - tx) < SNAP_THRESHOLD) { result.x = tx - obj.w / 2; break; }
    }
    // y snapping
    for (const ty of h) {
      if (Math.abs(objLines.top - ty) < SNAP_THRESHOLD) { result.y = ty; break; }
      if (Math.abs(objLines.bottom - ty) < SNAP_THRESHOLD) { result.y = ty - obj.h; break; }
      if (Math.abs(objLines.cy - ty) < SNAP_THRESHOLD) { result.y = ty - obj.h / 2; break; }
    }
  }
  return result;
}

function updateSnapGuidesFor(id) {
  if (!state.snap.elements) {
    state.dragGuides = { x: null, y: null }; return;
  }
  const comps = getActiveComponents();
  const regions = getActiveMouseRegions();
  const obj = comps.find(x => x.id === id) || regions.find(x => x.id === id);
  if (!obj) return;

  const others = [...comps, ...regions].filter(x => !state.selectedIds.includes(x.id));
  const objCx = obj.x + obj.w / 2;
  const objCy = obj.y + obj.h / 2;
  let bestX = null, bestY = null;
  let bestDx = SNAP_THRESHOLD, bestDy = SNAP_THRESHOLD;

  for (const o of others) {
    const oV = [o.x, o.x + o.w, o.x + o.w / 2];
    const oH = [o.y, o.y + o.h, o.y + o.h / 2];
    [obj.x, obj.x + obj.w, objCx].forEach(p => {
      oV.forEach(t => {
        const d = Math.abs(p - t);
        if (d < bestDx) { bestDx = d; bestX = t; }
      });
    });
    [obj.y, obj.y + obj.h, objCy].forEach(p => {
      oH.forEach(t => {
        const d = Math.abs(p - t);
        if (d < bestDy) { bestDy = d; bestY = t; }
      });
    });
  }
  state.dragGuides = { x: bestX, y: bestY };
}

function renderSnapGuides() {
  const overlay = $('#canvas-overlay');
  // remove old guides
  overlay.querySelectorAll('.guide').forEach(g => g.remove());
  if (state.dragGuides.x !== null) {
    overlay.appendChild(el('div', {
      class: 'guide v',
      style: `left:${state.dragGuides.x * state.zoom}px;`
    }));
  }
  if (state.dragGuides.y !== null) {
    overlay.appendChild(el('div', {
      class: 'guide h',
      style: `top:${state.dragGuides.y * state.zoom}px;`
    }));
  }
}

/* ---------- Canvas viewport (pan and zoom) ---------- */
function applyCanvasViewportTransform() {
  const frame = $('#canvas-frame');
  if (!frame) return;
  frame.style.transform = `translate3d(${state.panX}px, ${state.panY}px, 0)`;
}

function getCanvasViewportCenter() {
  const rect = $('#canvas-wrap').getBoundingClientRect();
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

function constrainCanvasPan() {
  const wrap = $('#canvas-wrap');
  const frame = $('#canvas-frame');
  if (!wrap || !frame) return;
  const wrapRect = wrap.getBoundingClientRect();
  const frameRect = frame.getBoundingClientRect();
  const visibleGrip = Math.min(64, wrapRect.width / 3, wrapRect.height / 3);
  let adjustX = 0;
  let adjustY = 0;

  if (frameRect.right < wrapRect.left + visibleGrip) adjustX = wrapRect.left + visibleGrip - frameRect.right;
  if (frameRect.left > wrapRect.right - visibleGrip) adjustX = wrapRect.right - visibleGrip - frameRect.left;
  if (frameRect.bottom < wrapRect.top + visibleGrip) adjustY = wrapRect.top + visibleGrip - frameRect.bottom;
  if (frameRect.top > wrapRect.bottom - visibleGrip) adjustY = wrapRect.bottom - visibleGrip - frameRect.top;

  if (adjustX || adjustY) {
    state.panX += adjustX;
    state.panY += adjustY;
    applyCanvasViewportTransform();
  }
}

function panCanvasBy(dx, dy) {
  state.panX += dx;
  state.panY += dy;
  state.autoFit = false;
  applyCanvasViewportTransform();
  constrainCanvasPan();
}

function updatePanModeVisuals() {
  const wrap = $('#canvas-wrap');
  const button = $('#btn-pan');
  const active = state.panMode || spacePanActive;
  wrap?.classList.toggle('is-pan-mode', active);
  if (button) button.setAttribute('aria-pressed', String(state.panMode));
}

function setPanMode(enabled) {
  state.panMode = !!enabled;
  if (state.panMode) clearPendingPalette();
  updatePanModeVisuals();
  $('#status-msg').textContent = state.panMode
    ? 'PAN: drag the canvas to move; pinch or use zoom controls'
    : 'Ready';
}

function pointDistance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function pointCenter(a, b) {
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

function startSinglePointerPan(pointer) {
  viewportGesture = {
    kind: 'pan',
    pointerId: pointer.id,
    startX: pointer.x,
    startY: pointer.y,
    startPanX: state.panX,
    startPanY: state.panY,
    threshold: pointer.type === 'mouse' ? 3 : 8,
    moved: false
  };
}

function startPinchPan() {
  const points = [...viewportPointers.values()].slice(0, 2);
  if (points.length < 2) return;
  const center = pointCenter(points[0], points[1]);
  const frameRect = $('#canvas-frame').getBoundingClientRect();
  viewportGesture = {
    kind: 'pinch',
    startDistance: Math.max(1, pointDistance(points[0], points[1])),
    startZoom: state.zoom,
    logicalX: (center.x - frameRect.left) / state.zoom,
    logicalY: (center.y - frameRect.top) / state.zoom,
    moved: true
  };
  $('#canvas-wrap').classList.add('is-panning');
}

function updatePinchPan() {
  const points = [...viewportPointers.values()].slice(0, 2);
  if (points.length < 2 || viewportGesture?.kind !== 'pinch') return;
  const center = pointCenter(points[0], points[1]);
  const distance = Math.max(1, pointDistance(points[0], points[1]));
  state.zoom = Math.max(0.01, Math.min(2, viewportGesture.startZoom * distance / viewportGesture.startDistance));
  state.autoFit = false;

  renderCanvasFrame();
  updateCanvasNodePositions();
  const frameRect = $('#canvas-frame').getBoundingClientRect();
  state.panX += center.x - (frameRect.left + viewportGesture.logicalX * state.zoom);
  state.panY += center.y - (frameRect.top + viewportGesture.logicalY * state.zoom);
  applyCanvasViewportTransform();
  constrainCanvasPan();
}

function finishDirectResize(obj) {
  if (state.snap.grid) {
    const grid = Math.max(1, state.snap.gridSize || 1);
    obj.x = Math.round(obj.x / grid) * grid;
    obj.y = Math.round(obj.y / grid) * grid;
    obj.w = Math.max(10, Math.round(obj.w / grid) * grid);
    obj.h = Math.max(10, Math.round(obj.h / grid) * grid);
  }
}

function beginDirectPointerManipulation(e) {
  if (state.panMode || spacePanActive) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const node = e.target.closest('.gp-component, .mouse-region');
  if (!node || viewportGesture) return;

  // Capture direct manipulation at the overlay so mouse, touch and pen all
  // share the same threshold, snapping and resize behavior.
  e.preventDefault();
  e.stopPropagation();
  const overlay = $('#canvas-overlay');
  const id = node.dataset.id;
  const handle = e.target.closest('.resize-handle');
  const editable = getEditableObjectById(id);
  const startClient = { x: e.clientX, y: e.clientY };
  let lastClient = { ...startClient };
  let moved = false;
  let manipulationStarted = false;
  const threshold = e.pointerType === 'mouse' ? 4 : 8;
  const resizeStart = editable && handle
    ? { x: editable.x, y: editable.y, w: editable.w, h: editable.h }
    : null;

  updateSelectionFromPointer(id, e.pointerType === 'mouse' && e.shiftKey);
  refreshSelectionVisuals();
  overlay.setPointerCapture?.(e.pointerId);

  const onMove = ev => {
    if (ev.pointerId !== e.pointerId) return;
    const totalDxPx = ev.clientX - startClient.x;
    const totalDyPx = ev.clientY - startClient.y;
    if (!moved && Math.hypot(totalDxPx, totalDyPx) < threshold) return;
    moved = true;
    if (!editable) return;
    ev.preventDefault();

    if (!manipulationStarted) {
      manipulationStarted = true;
      document.body.classList.add('dragging-active');
      if (!handle) beginDragSession(id);
    }

    if (handle && resizeStart) {
      const dx = totalDxPx / state.zoom;
      const dy = totalDyPx / state.zoom;
      const west = handle.classList.contains('nw') || handle.classList.contains('sw');
      const north = handle.classList.contains('nw') || handle.classList.contains('ne');
      const nextW = Math.max(10, resizeStart.w + (west ? -dx : dx));
      const nextH = Math.max(10, resizeStart.h + (north ? -dy : dy));
      editable.x = west ? resizeStart.x + (resizeStart.w - nextW) : resizeStart.x;
      editable.y = north ? resizeStart.y + (resizeStart.h - nextH) : resizeStart.y;
      editable.w = nextW;
      editable.h = nextH;
      updateCanvasNodePositions();
    } else {
      const dx = (ev.clientX - lastClient.x) / state.zoom;
      const dy = (ev.clientY - lastClient.y) / state.zoom;
      moveSelectedDuringDrag(id, dx, dy);
      updateCanvasNodePositions();
      updateSnapGuidesFor(id);
      renderSnapGuides();
    }
    lastClient = { x: ev.clientX, y: ev.clientY };
  };

  const finish = ev => {
    if (ev.pointerId !== e.pointerId) return;
    cleanup();
    if (manipulationStarted && editable) {
      if (handle) finishDirectResize(editable);
      else finalSnapForSelection();
    }
    dragSession = null;
    state.dragGuides = { x: null, y: null };
    document.body.classList.remove('dragging-active');
    renderAll();
    requestAnimationFrame(() => document.querySelector(`[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true }));
  };

  const cleanup = () => {
    overlay.removeEventListener('pointermove', onMove);
    overlay.removeEventListener('pointerup', finish);
    overlay.removeEventListener('pointercancel', finish);
    overlay.removeEventListener('lostpointercapture', finish);
  };

  overlay.addEventListener('pointermove', onMove);
  overlay.addEventListener('pointerup', finish);
  overlay.addEventListener('pointercancel', finish);
  overlay.addEventListener('lostpointercapture', finish);
}

function bindViewportControls() {
  const wrap = $('#canvas-wrap');
  $('#btn-pan').addEventListener('click', () => setPanMode(!state.panMode));

  wrap.addEventListener('pointerdown', e => {
    const isMousePan = e.pointerType === 'mouse' && (e.button === 1 || state.panMode || spacePanActive);
    const isDirectPan = (e.pointerType === 'touch' || e.pointerType === 'pen') && state.panMode;
    if (!isMousePan && !isDirectPan) return;

    e.preventDefault();
    e.stopPropagation();
    wrap.focus({ preventScroll: true });
    wrap.setPointerCapture?.(e.pointerId);
    viewportPointers.set(e.pointerId, { id: e.pointerId, x: e.clientX, y: e.clientY, type: e.pointerType });
    if (viewportPointers.size >= 2) startPinchPan();
    else startSinglePointerPan(viewportPointers.get(e.pointerId));
  }, true);

  wrap.addEventListener('pointermove', e => {
    if (!viewportPointers.has(e.pointerId)) return;
    e.preventDefault();
    e.stopPropagation();
    const point = viewportPointers.get(e.pointerId);
    point.x = e.clientX;
    point.y = e.clientY;

    if (viewportPointers.size >= 2) {
      if (viewportGesture?.kind !== 'pinch') startPinchPan();
      updatePinchPan();
      return;
    }

    if (viewportGesture?.kind !== 'pan' || viewportGesture.pointerId !== e.pointerId) {
      startSinglePointerPan(point);
    }
    const dx = point.x - viewportGesture.startX;
    const dy = point.y - viewportGesture.startY;
    if (!viewportGesture.moved && Math.hypot(dx, dy) < viewportGesture.threshold) return;
    viewportGesture.moved = true;
    wrap.classList.add('is-panning');
    state.panX = viewportGesture.startPanX + dx;
    state.panY = viewportGesture.startPanY + dy;
    state.autoFit = false;
    applyCanvasViewportTransform();
    constrainCanvasPan();
  }, true);

  const finishPointer = e => {
    if (!viewportPointers.has(e.pointerId)) return;
    viewportPointers.delete(e.pointerId);
    if (viewportPointers.size === 1) {
      startSinglePointerPan([...viewportPointers.values()][0]);
      return;
    }
    if (viewportPointers.size === 0) {
      viewportGesture = null;
      wrap.classList.remove('is-panning');
      renderComponents();
    }
  };
  wrap.addEventListener('pointerup', finishPointer, true);
  wrap.addEventListener('pointercancel', finishPointer, true);
  wrap.addEventListener('lostpointercapture', finishPointer, true);
}

/* ---------- Canvas (drop, pointer selection, marquee) ---------- */
function bindCanvas() {
  const wrap = $('#canvas-wrap');
  const frame = $('#canvas-frame');
  const overlay = $('#canvas-overlay');

  overlay.addEventListener('pointerdown', beginDirectPointerManipulation, true);

  // drop from palette
  frame.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  frame.addEventListener('drop', e => {
    e.preventDefault();
    const type = e.dataTransfer.getData('text/component-type');
    if (!type) return;
    const { x, y } = canvasPointFromEvent(e);
    clearPendingPalette();
    if (type === 'mouseRegion') {
      addMouseRegion(x, y);
    } else {
      addComponent(type, x, y);
    }
  });

  // A palette tap arms a component; the next empty-canvas tap places it.
  frame.addEventListener('pointerdown', e => {
    if (state.panMode || spacePanActive) return;
    if (state.pendingPaletteType) {
      if (e.target.closest('.gp-component, .mouse-region, .resize-handle')) return;
      e.preventDefault();
      e.stopPropagation();
      const { x, y } = canvasPointFromEvent(e);
      placePendingPaletteAt(x, y);
      return;
    }

    if (e.target === frame || e.target.id === 'canvas-overlay' || e.target.id === 'canvas-bg') {
      state.selectedIds = [];
      if (e.pointerType === 'touch') {
        renderAll();
      } else if (e.button === 0) {
        startMarquee(e);
      }
    }
  });

  // Select on pointer down and defer the full rerender until a tap ends.
  overlay.addEventListener('pointerdown', e => {
    if (state.panMode || spacePanActive) return;
    const node = e.target.closest('.gp-component, .mouse-region');
    if (!node) return;
    if (e.target.classList.contains('resize-handle')) return;

    // Prevent the frame handler from treating a component tap as
    // an empty-canvas marquee selection.
    e.stopPropagation();

    const id = node.dataset.id;
    const downX = e.clientX;
    const downY = e.clientY;

    updateSelectionFromPointer(id, e.pointerType === 'mouse' && e.shiftKey);
    refreshSelectionVisuals();

    // A simple tap should show resize handles, but doing a full render on
    // pointerdown breaks dragging. Re-render after release only when
    // the pointer did not actually move.
    const onUp = ev => {
      if (ev.pointerId !== e.pointerId) return;
      cleanup();
      const threshold = e.pointerType === 'mouse' ? 4 : 8;
      const moved = Math.hypot(ev.clientX - downX, ev.clientY - downY) > threshold;
      if (!moved) {
        renderAll();
        requestAnimationFrame(() => document.querySelector(`[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true }));
      }
    };
    const cleanup = () => {
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', cleanup);
    };
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', cleanup, { once: true });
  });

  overlay.addEventListener('keydown', e => {
    const node = e.target.closest('.gp-component, .mouse-region');
    if (!node || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault();
    updateSelectionFromPointer(node.dataset.id, e.shiftKey);
    renderAll();
    requestAnimationFrame(() => document.querySelector(`[data-id="${CSS.escape(node.dataset.id)}"]`)?.focus({ preventScroll: true }));
  });

  // mouse position
  frame.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    const point = canvasPointFromEvent(e);
    const x = Math.round(point.x);
    const y = Math.round(point.y);
    $('#status-mouse').textContent = `x: ${x}, y: ${y}`;
  });

  // Ctrl/Command + wheel zooms around the pointer. Wheel pans in the
  // dedicated desktop canvas or whenever explicit pan mode is active.
  wrap.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const dir = e.deltaY < 0 ? 1.1 : 1/1.1;
      setZoom(state.zoom * dir, { x: e.clientX, y: e.clientY });
    } else if (state.panMode || window.matchMedia('(min-width: 901px)').matches) {
      e.preventDefault();
      panCanvasBy(-e.deltaX, -e.deltaY);
    }
  }, { passive: false });
}

function startMarquee(e) {
  const frame = $('#canvas-frame');
  const rect = frame.getBoundingClientRect();
  const startX = e.clientX - rect.left;
  const startY = e.clientY - rect.top;

  const m = el('div', { class: 'marquee', style: `left:${startX}px;top:${startY}px;width:0;height:0;` });
  let mounted = false;

  const onMove = ev => {
    if (ev.pointerId !== e.pointerId) return;
    const cx = ev.clientX - rect.left;
    const cy = ev.clientY - rect.top;
    const x = Math.min(startX, cx), y = Math.min(startY, cy);
    const w = Math.abs(cx - startX), h = Math.abs(cy - startY);
    if (!mounted && Math.hypot(w, h) >= (e.pointerType === 'mouse' ? 4 : 8)) {
      $('#canvas-overlay').appendChild(m);
      mounted = true;
    }
    if (!mounted) return;
    m.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;position:absolute;`;
  };
  const onUp = ev => {
    if (ev.pointerId !== e.pointerId) return;
    const cx = ev.clientX - rect.left;
    const cy = ev.clientY - rect.top;
    const x = Math.min(startX, cx) / state.zoom;
    const y = Math.min(startY, cy) / state.zoom;
    const w = Math.abs(cx - startX) / state.zoom;
    const h = Math.abs(cy - startY) / state.zoom;
    if (w > 4 || h > 4) {
      const sel = [];
      [...getActiveComponents(), ...getActiveMouseRegions()].forEach(o => {
        if (o.x + o.w > x && o.x < x + w && o.y + o.h > y && o.y < y + h) {
          sel.push(o.id);
        }
      });
      state.selectedIds = sel;
    }
    m.remove();
    cleanup();
    renderAll();
  };
  const onCancel = ev => {
    if (ev.pointerId !== e.pointerId) return;
    m.remove();
    cleanup();
    renderAll();
  };
  const cleanup = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onCancel);
}

function setZoom(z, anchorClient = null, markManual = true) {
  const frame = $('#canvas-frame');
  const anchor = anchorClient || getCanvasViewportCenter();
  const beforeRect = frame?.getBoundingClientRect();
  const logicalX = beforeRect ? (anchor.x - beforeRect.left) / state.zoom : 0;
  const logicalY = beforeRect ? (anchor.y - beforeRect.top) / state.zoom : 0;

  state.zoom = Math.max(0.01, Math.min(2, z));
  if (markManual) state.autoFit = false;
  renderCanvasFrame();
  renderComponents();

  if (beforeRect) {
    const afterRect = frame.getBoundingClientRect();
    state.panX += anchor.x - (afterRect.left + logicalX * state.zoom);
    state.panY += anchor.y - (afterRect.top + logicalY * state.zoom);
    applyCanvasViewportTransform();
    constrainCanvasPan();
  }
}
function fitZoom() {
  const r = getActiveRes();
  if (!r) return;
  const wrap = $('#canvas-wrap');
  const styles = getComputedStyle(wrap);
  const paddingX = (parseFloat(styles.paddingLeft) || 0) + (parseFloat(styles.paddingRight) || 0);
  const paddingY = (parseFloat(styles.paddingTop) || 0) + (parseFloat(styles.paddingBottom) || 0);
  const breathingRoom = window.matchMedia('(max-width: 900px)').matches ? 0 : 60;
  const availableWidth = Math.max(1, wrap.clientWidth - paddingX - breathingRoom);
  const availableHeight = Math.max(1, wrap.clientHeight - paddingY - breathingRoom);
  const z = Math.min(
    availableWidth / r.width,
    availableHeight / r.height
  );
  state.panX = 0;
  state.panY = 0;
  state.autoFit = true;
  state.zoom = Math.max(0.01, Math.min(2, z));
  renderCanvasFrame();
  renderComponents();
}

/* ---------- Modals ---------- */
let activeModalBackdrop = null;
let modalReturnFocus = null;
let modalScrollY = 0;

function getOpenModal() {
  return activeModalBackdrop?.classList.contains('show') ? activeModalBackdrop : null;
}

function lockPageForModal() {
  if (document.body.classList.contains('modal-open')) return;
  modalScrollY = window.scrollY;
  document.body.classList.add('modal-open');
  document.body.style.position = 'fixed';
  document.body.style.top = `-${modalScrollY}px`;
  document.body.style.width = '100%';
}

function unlockPageAfterModal() {
  document.body.classList.remove('modal-open');
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  window.scrollTo(0, modalScrollY);
}

function openEditorModal(backdrop) {
  if (!backdrop) return;
  if (activeModalBackdrop && activeModalBackdrop !== backdrop) {
    closeEditorModal(activeModalBackdrop, false);
  }
  modalReturnFocus = document.activeElement;
  activeModalBackdrop = backdrop;
  backdrop.classList.add('show');
  backdrop.setAttribute('aria-hidden', 'false');
  lockPageForModal();
  requestAnimationFrame(() => {
    const initial = backdrop.querySelector('textarea, input:not([type="hidden"]), select, button:not([disabled]), [tabindex="0"]');
    initial?.focus({ preventScroll: true });
  });
}

function closeEditorModal(backdrop = activeModalBackdrop, restoreFocus = true) {
  if (!backdrop) return;
  backdrop.classList.remove('show');
  backdrop.setAttribute('aria-hidden', 'true');
  if (activeModalBackdrop === backdrop) activeModalBackdrop = null;
  unlockPageAfterModal();
  if (restoreFocus && modalReturnFocus?.isConnected) modalReturnFocus.focus({ preventScroll: true });
  modalReturnFocus = null;
}

function isRapidActivation(button, interval = 400) {
  const now = performance.now();
  const previous = Number(button.dataset.lastActivation || 0);
  button.dataset.lastActivation = String(now);
  return now - previous < interval;
}

async function runButtonTask(button, task) {
  if (button.disabled) return;
  button.disabled = true;
  button.setAttribute('aria-busy', 'true');
  try {
    await task();
  } finally {
    button.disabled = false;
    button.removeAttribute('aria-busy');
  }
}

function bindModals() {
  $('#modal-cancel').onclick = () => closeEditorModal($('#modal'));
  $('#modal-copy').onclick = () => {
    const button = $('#modal-copy');
    runButtonTask(button, async () => {
      try {
        await navigator.clipboard.writeText($('#modal-text').value);
        toast('클립보드에 복사됨');
      } catch (error) {
        toast('클립보드 복사에 실패했습니다', 'error');
      }
    });
  };
  $('#modal-download').onclick = () => {
    if (isRapidActivation($('#modal-download'))) return;
    const blob = new Blob([$('#modal-text').value], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (state.meta.name || 'gamepad') + '.json';
    a.click();
    URL.revokeObjectURL(url);
  };
  $('#modal-confirm').onclick = () => {
    try {
      const data = JSON.parse($('#modal-text').value);
      loadProject(data);
      closeEditorModal($('#modal'));
      toast('JSON을 불러왔습니다');
    } catch (err) {
      toast('JSON 파싱 오류: ' + err.message, 'error');
    }
  };
  $('#file-input').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      $('#modal-text').value = ev.target.result;
    };
    reader.readAsText(f);
  };

  // Resolution modal
  $('#res-cancel').onclick = () => closeEditorModal($('#res-modal'));
  $('#res-add').onclick = () => {
    if (isRapidActivation($('#res-add'))) return;
    const w = parseInt($('#new-w').value);
    const h = parseInt($('#new-h').value);
    const display = normalizeDisplayTarget($('#new-display').value);
    const copyFrom = $('#copy-from').value || null;
    if (!w || !h) { toast('해상도를 입력하세요', 'error'); return; }
    if (state.resolutions.find(r => r.width === w && r.height === h && normalizeDisplayTarget(r.display) === display)) {
      toast('이미 존재하는 해상도입니다', 'error'); return;
    }
    addResolution(w, h, display, copyFrom);
    closeEditorModal($('#res-modal'));
    toast(`${displayTargetLabel(display)} ${w}×${h} 레이아웃 추가됨`);
  };
  $$('.res-preset').forEach(b => {
    b.onclick = () => {
      $('#new-w').value = b.dataset.w;
      $('#new-h').value = b.dataset.h;
    };
  });

  $$('.modal-backdrop').forEach(backdrop => {
    backdrop.addEventListener('click', e => {
      if (e.target === backdrop) closeEditorModal(backdrop);
    });
  });

  document.addEventListener('keydown', e => {
    const backdrop = getOpenModal();
    if (!backdrop) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopImmediatePropagation();
      closeEditorModal(backdrop);
      return;
    }
    if (e.key !== 'Tab') return;
    const focusable = [...backdrop.querySelectorAll('button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex="0"]')]
      .filter(node => node.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });
}

function openResModal() {
  $('#new-w').value = '';
  $('#new-h').value = '';
  $('#new-display').value = 'main';
  const sel = $('#copy-from');
  sel.innerHTML = '<option value="">(empty)</option>';
  state.resolutions.forEach(r => {
    sel.appendChild(el('option', { value: r.id }, `Copy from ${displayTargetLabel(r.display)} ${r.width}×${r.height}`));
  });
  openEditorModal($('#res-modal'));
}

function showImportExport(isImport) {
  $('#modal-title').textContent = isImport ? 'Import JSON' : 'Export JSON';
  $('#modal-text').value = isImport ? '' : JSON.stringify(serializeProject(), null, 2);
  $('#modal-confirm').style.display = isImport ? 'inline-flex' : 'none';
  $('#modal-copy').style.display = isImport ? 'none' : 'inline-flex';
  $('#modal-download').style.display = isImport ? 'none' : 'inline-flex';

  // For import, also offer file picker
  if (isImport) {
    $('#modal-text').placeholder = 'JSON을 붙여넣거나 아래에서 파일을 선택하세요';
    if (!$('#modal-load-file')) {
      const btn = el('button', {
        type: 'button',
