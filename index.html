/* ---------- Runtime schema helpers ---------- */
function setComponentInputType(c, inputType) {
  c.inputType = inputType;
  c.runtime = c.runtime || {};
  c.runtime.inputType = inputType;
  // Reset binding when the target class changes, because stick/dpad/button mappings are structurally different.
  normalizeComponentRuntime(c, true);
}

function normalizeComponentRuntime(c, forceDefaults = false) {
  c.runtime = c.runtime || {};
  c.inputType = c.inputType || c.runtime.inputType || COMPONENT_TYPES[c.type]?.inputType || 'controller';
  c.runtime.inputType = c.inputType;

  if (['button','key','combo','shoulder'].includes(c.type)) {
    c.runtime.behavior = c.runtime.behavior || (c.type === 'combo' ? 'tap' : 'hold');
    if (c.inputType === 'keyboard') {
      if (!c.runtime.binding || forceDefaults) {
        c.runtime.binding = c.type === 'combo'
          ? { keys: splitBindingList(c.binding || 'ControlLeft,KeyC') }
          : { key: c.binding || (c.type === 'key' ? 'KeyW' : 'Space') };
      }
    } else if (c.inputType === 'mouse') {
      if (!c.runtime.binding || forceDefaults) {
        c.runtime.binding = c.type === 'combo'
          ? { buttons: splitBindingList(c.binding || 'MouseLeft,MouseRight') }
          : { button: c.binding || 'MouseLeft' };
      }
    } else {
      if (!c.runtime.binding || forceDefaults) c.runtime.binding = { button: c.binding || defaultControllerButton(c.type, c.label) };
    }
  }

  if (c.type === 'dpad') {
    c.runtime.mode = c.runtime.mode || '4way';
    if (!c.runtime.bindings || forceDefaults) {
      c.runtime.bindings = c.inputType === 'keyboard'
        ? { up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD', upLeft:'KeyW+KeyA', upRight:'KeyW+KeyD', downLeft:'KeyS+KeyA', downRight:'KeyS+KeyD' }
        : { up:'DPadUp', down:'DPadDown', left:'DPadLeft', right:'DPadRight', upLeft:'DPadUp+DPadLeft', upRight:'DPadUp+DPadRight', downLeft:'DPadDown+DPadLeft', downRight:'DPadDown+DPadRight' };
    }
  }

  if (c.type === 'stick') {
    c.deadzone = Number.isFinite(parseFloat(c.deadzone)) ? parseFloat(c.deadzone) : 0.15;
    if (c.fixed === undefined) c.fixed = true;
    c.runtime.deadzone = c.deadzone;
    c.runtime.fixed = c.fixed;
    c.runtime.mode = c.runtime.mode || (c.inputType === 'keyboard' ? 'digital4way' : 'analog');
    if (c.inputType === 'keyboard') {
      if (!c.runtime.bindings || forceDefaults) c.runtime.bindings = { up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD' };
    } else {
      if (!c.runtime.binding || forceDefaults) c.runtime.binding = { axisX:'LeftStickX', axisY:'LeftStickY' };
      c.runtime.range = c.runtime.range || [-1, 1];
    }
  }

  if (c.type === 'trigger') {
    if (c.analog === undefined) c.analog = c.inputType === 'controller';
    c.runtime.analog = c.analog;
    if (c.inputType === 'keyboard') {
      if (!c.runtime.binding || forceDefaults) c.runtime.binding = { key: c.binding || 'ShiftLeft' };
      c.runtime.analog = false;
      c.analog = false;
    } else if (c.inputType === 'mouse') {
      if (!c.runtime.binding || forceDefaults) c.runtime.binding = { button: c.binding || 'MouseRight' };
      c.runtime.analog = false;
      c.analog = false;
    } else {
      if (!c.runtime.binding || forceDefaults) c.runtime.binding = { axis: c.binding || (String(c.label || '').includes('R') ? 'RT' : 'LT') };
      c.runtime.range = c.runtime.range || [0, 1];
    }
  }

  if (c.type === 'mouseScroll') {
    c.inputType = 'mouse';
    c.runtime.inputType = 'mouse';
    c.runtime.role = 'mouseScroll';
    c.runtime.direction = c.runtime.direction || 'vertical';
    if (!c.runtime.binding || forceDefaults) {
      c.runtime.binding = {
        vertical: 'MouseWheelY',
        horizontal: 'MouseWheelX',
        up: 'MouseWheelUp',
        down: 'MouseWheelDown',
        left: 'MouseWheelLeft',
        right: 'MouseWheelRight'
      };
    }
    c.runtime.step = Number.isFinite(parseFloat(c.runtime.step)) ? parseFloat(c.runtime.step) : 120;
    c.runtime.sensitivity = Number.isFinite(parseFloat(c.runtime.sensitivity)) ? parseFloat(c.runtime.sensitivity) : 1.0;
    c.runtime.invert = !!c.runtime.invert;
    c.runtime.momentum = !!c.runtime.momentum;
  }

  if (c.type === 'touchpad') {
    if (!['mouse','controller','keyboard'].includes(c.inputType)) c.inputType = 'mouse';
    c.runtime.inputType = c.inputType;
    c.runtime.mode = c.runtime.mode || (c.inputType === 'mouse' ? 'relative' : 'absolute');
    if (!c.runtime.binding || forceDefaults) {
      c.runtime.binding = c.inputType === 'mouse'
        ? { moveX:'MouseX', moveY:'MouseY', tap:'MouseLeft', twoFingerTap:'MouseRight', scrollY:'MouseWheelY' }
        : { x:'TouchX', y:'TouchY', press:'TouchPress' };
    }
    c.runtime.sensitivity = c.runtime.sensitivity ?? 1.0;
    c.runtime.invertY = !!c.runtime.invertY;
  }

  if (c.type === 'region') {
    c.runtime.role = c.runtime.role || 'gesture';
    c.runtime.gestures = c.runtime.gestures || {
      tap: { binding: 'Space' },
      swipeLeft: { binding: 'KeyA' },
      swipeRight: { binding: 'KeyD' },
      longPress: { binding: 'KeyE' }
    };
  }

  c.runtime.multiTouch = c.runtime.multiTouch ?? true;
  c.runtime.touchIdPolicy = c.runtime.touchIdPolicy || 'lockUntilRelease';
  c.runtime.z = c.z ?? c.runtime.z ?? 0;
}

function defaultControllerButton(type, label) {
  if (type === 'shoulder') return String(label || 'L1').includes('R') ? 'RB' : 'LB';
  return label || 'A';
}
function splitBindingList(v) {
  if (Array.isArray(v)) return v;
  return String(v || '').split(/[+,]/).map(x => x.trim()).filter(Boolean);
}
function setRuntimePath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    cur[parts[i]] = cur[parts[i]] || {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
}
function getRuntimePath(obj, path, fallback = '') {
  const parts = path.split('.');
  let cur = obj;
  for (const k of parts) {
    if (cur == null || cur[k] === undefined) return fallback;
    cur = cur[k];
  }
  return Array.isArray(cur) ? cur.join(',') : cur;
}
function addRuntimeTextField(wrap, label, c, path, placeholder = '') {
  wrap.appendChild(makeTextField(label, getRuntimePath(c.runtime, path, ''), v => {
    if (path === 'binding.keys' || path === 'binding.buttons') setRuntimePath(c.runtime, path, splitBindingList(v));
    else if (path === 'range') setRuntimePath(c.runtime, path, String(v).split(',').map(x => parseFloat(x.trim())).filter(n => Number.isFinite(n)));
    else setRuntimePath(c.runtime, path, v);
  }, placeholder, bindingListFor(c, path)));
}
function addRuntimeSelectField(wrap, label, c, path, options, rerender = false) {
  wrap.appendChild(makeSelectField(label, getRuntimePath(c.runtime, path, options[0][0]), options, v => { setRuntimePath(c.runtime, path, v); if (rerender) renderAll(); }));
}

function renderRuntimeInspectorFields(wrap, c) {
  normalizeComponentRuntime(c);
  wrap.appendChild(el('div', { class: 'section-title', style: 'margin-top:18px;' }, 'Runtime binding'));
  wrap.appendChild(el('div', { style: 'font-size:10px; color:var(--text-mute); margin:-6px 0 10px; line-height:1.45;' }, '자동완성 기준: KeyboardEvent.code / W3C Standard Gamepad aliases + Button0~16, Axis0~3 / MouseEvent.button 0~4 + buttons bitmask'));

  if (['button','key','combo','shoulder'].includes(c.type)) {
    addRuntimeSelectField(wrap, 'Press behavior', c, 'behavior', [['hold','Hold while touched'],['tap','Tap once'],['toggle','Toggle']]);
    if (c.inputType === 'keyboard') {
      if (c.type === 'combo') addRuntimeTextField(wrap, 'Combo keys', c, 'binding.keys', 'ControlLeft, KeyC');
      else addRuntimeTextField(wrap, 'Key', c, 'binding.key', 'Space, KeyW, Enter');
    } else if (c.inputType === 'mouse') {
      if (c.type === 'combo') addRuntimeTextField(wrap, 'Mouse buttons', c, 'binding.buttons', 'MouseLeft, MouseRight');
      else addRuntimeTextField(wrap, 'Mouse button', c, 'binding.button', 'MouseLeft, MouseRight, MouseMiddle');
    } else {
      addRuntimeTextField(wrap, 'Controller button', c, 'binding.button', 'A, B, X, Y, LB, RB');
    }
  }

  if (c.type === 'dpad') {
    addRuntimeSelectField(wrap, 'D-Pad mode', c, 'mode', [['4way','4-way'],['8way','8-way']], true);
    ['up','down','left','right'].forEach(dir => addRuntimeTextField(wrap, dir.toUpperCase(), c, 'bindings.' + dir, c.inputType === 'keyboard' ? 'KeyW' : 'DPadUp'));
    if (c.runtime.mode === '8way') ['upLeft','upRight','downLeft','downRight'].forEach(dir => addRuntimeTextField(wrap, dir, c, 'bindings.' + dir, 'KeyW+KeyA'));
  }

  if (c.type === 'stick') {
    addRuntimeSelectField(wrap, 'Stick mode', c, 'mode', c.inputType === 'keyboard' ? [['digital4way','Digital 4-way'],['digital8way','Digital 8-way']] : [['analog','Analog axes']]);
    if (c.inputType === 'keyboard') {
      ['up','down','left','right'].forEach(dir => addRuntimeTextField(wrap, dir.toUpperCase(), c, 'bindings.' + dir, dir === 'up' ? 'KeyW' : ''));
    } else {
      addRuntimeTextField(wrap, 'Axis X', c, 'binding.axisX', 'LeftStickX');
      addRuntimeTextField(wrap, 'Axis Y', c, 'binding.axisY', 'LeftStickY');
      addRuntimeTextField(wrap, 'Range', c, 'range', '-1,1');
    }
    wrap.appendChild(makeTextField('Deadzone (0-1)', c.deadzone ?? '0.15', v => { c.deadzone = parseFloat(v) || 0; c.runtime.deadzone = c.deadzone; }));
    wrap.appendChild(el('label', { class: 'checkbox' }, [
      el('input', { type: 'checkbox', ...(c.fixed ? {} : { checked: 'checked' }), onchange: e => { c.fixed = !e.target.checked; c.runtime.fixed = c.fixed; } }),
      'Floating (origin follows touch)'
    ]));
  }

  if (c.type === 'trigger') {
    if (c.inputType === 'keyboard') {
      addRuntimeTextField(wrap, 'Key', c, 'binding.key', 'ShiftLeft');
    } else if (c.inputType === 'mouse') {
      addRuntimeTextField(wrap, 'Mouse button', c, 'binding.button', 'MouseRight');
    } else {
      addRuntimeTextField(wrap, 'Axis', c, 'binding.axis', 'LT or RT');
      wrap.appendChild(el('label', { class: 'checkbox' }, [
        el('input', { type: 'checkbox', ...(c.analog !== false ? { checked: 'checked' } : {}), onchange: e => { c.analog = e.target.checked; c.runtime.analog = c.analog; } }),
        'Analog (pressure-sensitive)'
      ]));
      addRuntimeTextField(wrap, 'Range', c, 'range', '0,1');
    }
  }

  if (c.type === 'mouseScroll') {
    addRuntimeSelectField(wrap, 'Scroll direction', c, 'direction', [
      ['vertical','Vertical only (상하)'],
      ['horizontal','Horizontal only (좌우)'],
      ['both','Both vertical + horizontal']
    ], true);

    if (c.runtime.direction === 'vertical' || c.runtime.direction === 'both') {
      addRuntimeTextField(wrap, 'Vertical wheel', c, 'binding.vertical', 'MouseWheelY');
      addRuntimeTextField(wrap, 'Wheel up', c, 'binding.up', 'MouseWheelUp');
      addRuntimeTextField(wrap, 'Wheel down', c, 'binding.down', 'MouseWheelDown');
    }
    if (c.runtime.direction === 'horizontal' || c.runtime.direction === 'both') {
      addRuntimeTextField(wrap, 'Horizontal wheel', c, 'binding.horizontal', 'MouseWheelX');
      addRuntimeTextField(wrap, 'Wheel left', c, 'binding.left', 'MouseWheelLeft');
      addRuntimeTextField(wrap, 'Wheel right', c, 'binding.right', 'MouseWheelRight');
    }

    wrap.appendChild(makeTextField('Scroll step / notch', c.runtime.step ?? 120, v => { c.runtime.step = parseFloat(v) || 120; }, '120'));
    wrap.appendChild(makeTextField('Sensitivity', c.runtime.sensitivity ?? 1, v => { c.runtime.sensitivity = parseFloat(v) || 1; }, '1.0'));
    wrap.appendChild(el('label', { class: 'checkbox' }, [
      el('input', { type: 'checkbox', ...(c.runtime.invert ? { checked: 'checked' } : {}), onchange: e => { c.runtime.invert = e.target.checked; } }),
      'Invert scroll direction'
    ]));
    wrap.appendChild(el('label', { class: 'checkbox' }, [
      el('input', { type: 'checkbox', ...(c.runtime.momentum ? { checked: 'checked' } : {}), onchange: e => { c.runtime.momentum = e.target.checked; } }),
      'Momentum / smooth scroll hint'
    ]));
  }

  if (c.type === 'touchpad') {
    addRuntimeSelectField(wrap, 'Mode', c, 'mode', [['relative','Relative mouse'],['absolute','Absolute touch']]);
    Object.keys(c.runtime.binding || {}).forEach(k => addRuntimeTextField(wrap, k, c, 'binding.' + k, k));
    wrap.appendChild(makeTextField('Sensitivity', c.runtime.sensitivity ?? 1, v => { c.runtime.sensitivity = parseFloat(v) || 1; }));
    wrap.appendChild(el('label', { class: 'checkbox' }, [
      el('input', { type: 'checkbox', ...(c.runtime.invertY ? { checked: 'checked' } : {}), onchange: e => { c.runtime.invertY = e.target.checked; } }),
      'Invert Y'
    ]));
  }

  if (c.type === 'region') {
    addRuntimeSelectField(wrap, 'Region role', c, 'role', [['gesture','Gesture region'],['touchpad','Touchpad region'],['mouseFilter','Mouse filter']], true);
    if (c.runtime.role === 'mouseFilter') {
      addRuntimeSelectField(wrap, 'Mouse behavior', c, 'behavior', [['ignore','Ignore mouse'],['allow','Allow mouse']]);
    } else {
      ['tap','swipeLeft','swipeRight','longPress'].forEach(g => addRuntimeTextField(wrap, g, c, 'gestures.' + g + '.binding', 'Key / button'));
    }
  }

  wrap.appendChild(el('div', { class: 'section-title', style: 'margin-top:18px;' }, 'Runtime policy'));
  wrap.appendChild(el('label', { class: 'checkbox' }, [
    el('input', { type: 'checkbox', ...(c.runtime.multiTouch ? { checked: 'checked' } : {}), onchange: e => { c.runtime.multiTouch = e.target.checked; } }),
    'Allow multi-touch'
  ]));
  addRuntimeSelectField(wrap, 'Touch ID policy', c, 'touchIdPolicy', [['lockUntilRelease','Lock until release'],['shared','Shared'],['latestWins','Latest touch wins']]);
  wrap.appendChild(makeTextField('Z index', c.runtime.z ?? 0, v => { c.runtime.z = parseInt(v) || 0; c.z = c.runtime.z; renderComponents(); }));
}

/* ---------- Inspector helpers ---------- */
function makeTextField(label, val, onchange, placeholder = '', listId = '') {
  const f = el('div', { class: 'field' }, [el('label', { class: 'field-label' }, label)]);
  const attrs = {
    type: 'text', class: 'input-text', value: val, placeholder,
    onchange: e => onchange(e.target.value),
    oninput: e => onchange(e.target.value)
  };
  if (listId) attrs.list = listId;
  const inp = el('input', attrs);
  f.appendChild(inp);
  return f;
}
function makeSelectField(label, val, options, onchange) {
  const f = el('div', { class: 'field' }, [el('label', { class: 'field-label' }, label)]);
  const sel = el('select', { class: 'input-select', onchange: e => onchange(e.target.value) });
  options.forEach(([v, l]) => {
    const opt = el('option', { value: v }, l);
    if (v === val) opt.setAttribute('selected', '');
    sel.appendChild(opt);
  });
  f.appendChild(sel);
  return f;
}
function makeNumGrid(items) {
  const grid = el('div', { style: 'display:grid; grid-template-columns:1fr 1fr; gap:6px;' });
  items.forEach(it => {
    const wrap = el('div');
    wrap.appendChild(el('div', { style: 'font-size:10px; color:var(--text-mute); margin-bottom:2px;' }, it.label));
    wrap.appendChild(el('input', {
      type: 'number', class: 'input-num', value: it.val,
      onchange: e => it.on(parseFloat(e.target.value) || 0),
      oninput: e => it.on(parseFloat(e.target.value) || 0)
    }));
    grid.appendChild(wrap);
  });
  return grid;
}

/* ---------- Component CRUD ---------- */
function addComponent(type, x, y) {
  const def = COMPONENT_TYPES[type];
  if (!def) return;
  const r = getActiveRes();
  const c = {
    id: newId('c'),
    type,
    label: def.defaultLabel,
    inputType: def.inputType,
    binding: '',
    x: Math.round(x - def.defaultSize.w / 2),
    y: Math.round(y - def.defaultSize.h / 2),
    w: def.defaultSize.w,
    h: def.defaultSize.h,
    shape: def.shape,
    color: '',
    bg: '',
    mouseIgnore: type === 'touchpad' ? false : (def.inputType === 'controller' && type !== 'region'),
    locked: false
  };
  if (type === 'touchpad') { c.inputType = 'mouse'; }
  if (type === 'mouseScroll') { c.inputType = 'mouse'; c.mouseIgnore = false; }
  if (type === 'stick') { c.deadzone = 0.15; c.fixed = true; }
  if (type === 'trigger') { c.analog = c.inputType !== 'keyboard'; }
  normalizeComponentRuntime(c, true);
  r.components.push(c);
  state.selectedIds = [c.id];
  renderAll();
}

function addMouseRegion(x, y) {
  const r = getActiveRes();
  const mr = {
    id: newId('mr'),
    name: 'Mouse Region',
    behavior: 'ignore',
    x: Math.round(x - 100), y: Math.round(y - 100),
    w: 200, h: 200
  };
  r.mouseRegions.push(mr);
  state.selectedIds = [mr.id];
  renderAll();
}

function deleteSelected() {
  const r = getActiveRes();
  r.components = r.components.filter(c => !state.selectedIds.includes(c.id));
  r.mouseRegions = r.mouseRegions.filter(m => !state.selectedIds.includes(m.id));
  state.selectedIds = [];
  renderAll();
}
function duplicateSelected() {
  const r = getActiveRes();
  const newSel = [];
  state.selectedIds.forEach(id => {
    const c = r.components.find(x => x.id === id);
    if (c) {
      const copy = { ...JSON.parse(JSON.stringify(c)), id: newId('c'), x: c.x + 24, y: c.y + 24 };
      r.components.push(copy);
      newSel.push(copy.id);
    }
    const mr = r.mouseRegions.find(x => x.id === id);
    if (mr) {
      const copy = { ...JSON.parse(JSON.stringify(mr)), id: newId('mr'), x: mr.x + 24, y: mr.y + 24 };
      r.mouseRegions.push(copy);
      newSel.push(copy.id);
    }
  });
  state.selectedIds = newSel;
  renderAll();
}

/* ---------- Lightweight DOM updates during pointer interactions ---------- */
function refreshSelectionVisuals() {
  $$('#canvas-overlay .gp-component, #canvas-overlay .mouse-region').forEach(node => {
    node.classList.toggle('selected', state.selectedIds.includes(node.dataset.id));
  });
  renderInspector();
}

function updateCanvasNodePositions() {
  const z = state.zoom;
  const comps = getActiveComponents();
  const regions = getActiveMouseRegions();

  $$('#canvas-overlay .gp-component, #canvas-overlay .mouse-region').forEach(node => {
    const id = node.dataset.id;
    const o = comps.find(x => x.id === id) || regions.find(x => x.id === id);
    if (!o) return;

    node.style.left = (o.x * z) + 'px';
    node.style.top = (o.y * z) + 'px';
    node.style.width = (o.w * z) + 'px';
    node.style.height = (o.h * z) + 'px';

    if (node.classList.contains('gp-component')) {
      node.style.fontSize = Math.max(10, Math.min(o.w, o.h) * z * 0.22) + 'px';
    }
  });
}

function updateSelectionFromPointer(id, additive) {
  if (additive) {
    if (state.selectedIds.includes(id)) {
      state.selectedIds = state.selectedIds.filter(x => x !== id);
    } else {
      state.selectedIds = [...state.selectedIds, id];
    }
  } else if (!state.selectedIds.includes(id)) {
    state.selectedIds = [id];
  }
}

/* ---------- interact.js drag/resize with snapping ---------- */
function setupInteractions() {
  // unbind from old elements automatically since they're recreated
  const overlay = $('#canvas-overlay');
  const items = overlay.querySelectorAll('.gp-component, .mouse-region');

  items.forEach(node => {
    const id = node.dataset.id;
    const isRegion = node.dataset.kind === 'mouseRegion';
    const obj = isRegion
      ? getActiveMouseRegions().find(x => x.id === id)
      : getActiveComponents().find(x => x.id === id);
    if (!obj || obj.locked) return;

    interact(node).draggable({
      listeners: {
        start(event) {
          // Do not call renderAll() here. Re-rendering removes the DOM node
          // that interact.js is currently dragging, which cancels movement.
          if (!state.selectedIds.includes(id)) {
            state.selectedIds = event.shiftKey ? [...state.selectedIds, id] : [id];
            refreshSelectionVisuals();
          }
          beginDragSession(id);
          document.body.classList.add('dragging-active');
        },
        move(event) {
          // Move from the drag-start positions, then snap in real time.
          // This prevents grid snapping from eating small pointer deltas.
          const dx = event.dx / state.zoom;
          const dy = event.dy / state.zoom;
          moveSelectedDuringDrag(id, dx, dy);
          // Update styles in-place so the active drag node is not destroyed.
          updateCanvasNodePositions();
          // show snap guides for the primary item after the live snap correction
          updateSnapGuidesFor(id);
          renderSnapGuides();
        },
        end() {
          // final snap as a safety pass, then recreate handles/inspector
          finalSnapForSelection();
          dragSession = null;
          state.dragGuides = { x: null, y: null };
          renderComponents();
          renderSnapGuides();
          renderInspector();
          document.body.classList.remove('dragging-active');
        }
      }
    }).resizable({
      edges: { left: '.resize-handle.nw, .resize-handle.sw', right: '.resize-handle.ne, .resize-handle.se',
               top: '.resize-handle.nw, .resize-handle.ne', bottom: '.resize-handle.sw, .resize-handle.se' },
      listeners: {
        start() { document.body.classList.add('dragging-active'); },
        move(event) {
          const o = isRegion
            ? getActiveMouseRegions().find(x => x.id === id)
            : getActiveComponents().find(x => x.id === id);
          if (!o) return;
          o.w = Math.max(10, o.w + event.deltaRect.width / state.zoom);
          o.h = Math.max(10, o.h + event.deltaRect.height / state.zoom);
          o.x = o.x + event.deltaRect.left / state.zoom;
          o.y = o.y + event.deltaRect.top / state.zoom;
          // Keep the active resize node alive while resizing.
          updateCanvasNodePositions();
        },
        end() {
          // snap size to grid optionally
          if (state.snap.grid) {
            const o = isRegion
              ? getActiveMouseRegions().find(x => x.id === id)
              : getActiveComponents().find(x => x.id === id);
            if (o) {
              const g = state.snap.gridSize;
              o.x = Math.round(o.x / g) * g;
              o.y = Math.round(o.y / g) * g;
              o.w = Math.round(o.w / g) * g;
              o.h = Math.round(o.h / g) * g;
              renderComponents();
              renderInspector();
            }
          }
          document.body.classList.remove('dragging-active');
        }
      }
    });
  });
}

function getEditableObjectById(id) {
  const c = getActiveComponents().find(x => x.id === id);
  if (c) return c.locked ? null : c;
  return getActiveMouseRegions().find(x => x.id === id) || null;
}

function getSelectedEditableObjects() {
  return state.selectedIds
    .map(id => getEditableObjectById(id))
    .filter(Boolean);
}

function beginDragSession(primaryId) {
  const originals = new Map();
  getSelectedEditableObjects().forEach(o => {
    originals.set(o.id, { x: o.x, y: o.y });
  });
  dragSession = { primaryId, rawDx: 0, rawDy: 0, originals };
}

function moveSelectedDuringDrag(primaryId, dx, dy) {
  if (!dragSession || dragSession.primaryId !== primaryId) {
    beginDragSession(primaryId);
  }

  dragSession.rawDx += dx;
  dragSession.rawDy += dy;

  getSelectedEditableObjects().forEach(o => {
    const start = dragSession.originals.get(o.id);
    if (!start) return;
    o.x = start.x + dragSession.rawDx;
    o.y = start.y + dragSession.rawDy;
  });

  applyLiveSnapForSelection(primaryId);
}

function applyLiveSnapForSelection(primaryId) {
  const primary = getEditableObjectById(primaryId);
  if (!primary) return;

  let targetX = primary.x;
  let targetY = primary.y;

  if (state.snap.grid) {
    const g = Math.max(1, state.snap.gridSize || 1);
    targetX = Math.round(targetX / g) * g;
    targetY = Math.round(targetY / g) * g;
  }

  if (state.snap.elements) {
    const guide = computeGuideTarget(primary);
    if (guide.x !== null) targetX = guide.x;
    if (guide.y !== null) targetY = guide.y;
  }

  const correctionX = targetX - primary.x;
  const correctionY = targetY - primary.y;
  if (correctionX === 0 && correctionY === 0) return;

  getSelectedEditableObjects().forEach(o => {
    o.x += correctionX;
    o.y += correctionY;
  });
}

function moveSelected(dx, dy) {
  getSelectedEditableObjects().forEach(o => {
    o.x += dx;
    o.y += dy;
  });
}

function finalSnapForSelection() {
  const comps = getActiveComponents();
  const regions = getActiveMouseRegions();
  const targets = [...comps, ...regions].filter(x => state.selectedIds.includes(x.id));
  targets.forEach(o => {
    // Grid snap
    if (state.snap.grid) {
      const g = state.snap.gridSize;
      o.x = Math.round(o.x / g) * g;
      o.y = Math.round(o.y / g) * g;
    }
    // Element snap (handled via guides during move; final correction here)
    if (state.snap.elements) {
      const guide = computeGuideTarget(o);
      if (guide.x !== null) o.x = guide.x;
      if (guide.y !== null) o.y = guide.y;
    }
  });
}

const SNAP_THRESHOLD = 6; // canvas px
function computeGuideTarget(obj) {
  const result = { x: null, y: null };
  const others = [...getActiveComponents(), ...getActiveMouseRegions()]
    .filter(x => !state.selectedIds.includes(x.id));

  const objLines = {
    left: obj.x,
    right: obj.x + obj.w,
    cx: obj.x + obj.w / 2,
    top: obj.y,
    bottom: obj.y + obj.h,
    cy: obj.y + obj.h / 2
  };

  for (const o of others) {
    const v = [o.x, o.x + o.w, o.x + o.w / 2];
    const h = [o.y, o.y + o.h, o.y + o.h / 2];

    // x snapping
    for (const tx of v) {
      if (Math.abs(objLines.left - tx) < SNAP_THRESHOLD) { result.x = tx; break; }
      if (Math.abs(objLines.right - tx) < SNAP_THRESHOLD) { result.x = tx - obj.w; break; }
      if (Math.abs(objLines.cx - tx) < SNAP_THRESHOLD) { result.x = tx - obj.w / 2; break; }
    }
    // y snapping
    for (const ty of h) {
      if (Math.abs(objLines.top - ty) < SNAP_THRESHOLD) { result.y = ty; break; }
      if (Math.abs(objLines.bottom - ty) < SNAP_THRESHOLD) { result.y = ty - obj.h; break; }
      if (Math.abs(objLines.cy - ty) < SNAP_THRESHOLD) { result.y = ty - obj.h / 2; break; }
    }
  }
  return result;
}

function updateSnapGuidesFor(id) {
  if (!state.snap.elements) {
    state.dragGuides = { x: null, y: null }; return;
  }
  const comps = getActiveComponents();
  const regions = getActiveMouseRegions();
  const obj = comps.find(x => x.id === id) || regions.find(x => x.id === id);
  if (!obj) return;

  const others = [...comps, ...regions].filter(x => !state.selectedIds.includes(x.id));
  const objCx = obj.x + obj.w / 2;
  const objCy = obj.y + obj.h / 2;
  let bestX = null, bestY = null;
  let bestDx = SNAP_THRESHOLD, bestDy = SNAP_THRESHOLD;

  for (const o of others) {
    const oV = [o.x, o.x + o.w, o.x + o.w / 2];
    const oH = [o.y, o.y + o.h, o.y + o.h / 2];
    [obj.x, obj.x + obj.w, objCx].forEach(p => {
      oV.forEach(t => {
        const d = Math.abs(p - t);
        if (d < bestDx) { bestDx = d; bestX = t; }
      });
    });
    [obj.y, obj.y + obj.h, objCy].forEach(p => {
      oH.forEach(t => {
        const d = Math.abs(p - t);
        if (d < bestDy) { bestDy = d; bestY = t; }
      });
    });
  }
  state.dragGuides = { x: bestX, y: bestY };
}

function renderSnapGuides() {
  const overlay = $('#canvas-overlay');
  // remove old guides
  overlay.querySelectorAll('.guide').forEach(g => g.remove());
  if (state.dragGuides.x !== null) {
    overlay.appendChild(el('div', {
      class: 'guide v',
      style: `left:${state.dragGuides.x * state.zoom}px;`
    }));
  }
  if (state.dragGuides.y !== null) {
    overlay.appendChild(el('div', {
      class: 'guide h',
      style: `top:${state.dragGuides.y * state.zoom}px;`
    }));
  }
}

/* ---------- Canvas (drop, click, marquee) ---------- */
function bindCanvas() {
  const wrap = $('#canvas-wrap');
  const frame = $('#canvas-frame');

  // drop from palette
  frame.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  frame.addEventListener('drop', e => {
    e.preventDefault();
    const type = e.dataTransfer.getData('text/component-type');
    if (!type) return;
    const rect = frame.getBoundingClientRect();
    const x = (e.clientX - rect.left) / state.zoom;
    const y = (e.clientY - rect.top) / state.zoom;
    if (type === 'mouseRegion') {
      addMouseRegion(x, y);
    } else {
      addComponent(type, x, y);
    }
  });

  // click empty canvas to deselect
  frame.addEventListener('mousedown', e => {
    // Only if clicked directly on overlay/frame/bg
    if (e.target === frame || e.target.id === 'canvas-overlay' || e.target.id === 'canvas-bg') {
      state.selectedIds = [];
      renderAll();
      startMarquee(e);
    }
  });

  // select on click / prepare selection for drag
  $('#canvas-overlay').addEventListener('mousedown', e => {
    const node = e.target.closest('.gp-component, .mouse-region');
    if (!node) return;
    if (e.target.classList.contains('resize-handle')) return;

    // Prevent the frame mousedown handler from treating a component click as
    // an empty-canvas marquee selection.
    e.stopPropagation();

    const id = node.dataset.id;
    const downX = e.clientX;
    const downY = e.clientY;

    updateSelectionFromPointer(id, e.shiftKey);
    refreshSelectionVisuals();

    // A simple click should show resize handles, but doing a full render on
    // mousedown breaks dragging. Therefore only re-render after mouseup when
    // the pointer did not actually move.
    const onUp = ev => {
      document.removeEventListener('mouseup', onUp);
      const moved = Math.hypot(ev.clientX - downX, ev.clientY - downY) > 3;
      if (!moved) renderAll();
    };
    document.addEventListener('mouseup', onUp, { once: true });
  });

  // mouse position
  frame.addEventListener('mousemove', e => {
    const rect = frame.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left) / state.zoom);
    const y = Math.round((e.clientY - rect.top) / state.zoom);
    $('#status-mouse').textContent = `x: ${x}, y: ${y}`;
  });

  // wheel zoom
  wrap.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const dir = e.deltaY < 0 ? 1.1 : 1/1.1;
      setZoom(state.zoom * dir);
    }
  }, { passive: false });
}

function startMarquee(e) {
  const wrap = $('#canvas-wrap');
  const frame = $('#canvas-frame');
  const rect = frame.getBoundingClientRect();
  const startX = e.clientX - rect.left;
  const startY = e.clientY - rect.top;

  const m = el('div', { class: 'marquee', style: `left:${startX}px;top:${startY}px;width:0;height:0;` });
  $('#canvas-overlay').appendChild(m);

  const onMove = ev => {
    const cx = ev.clientX - rect.left;
    const cy = ev.clientY - rect.top;
    const x = Math.min(startX, cx), y = Math.min(startY, cy);
    const w = Math.abs(cx - startX), h = Math.abs(cy - startY);
    m.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;position:absolute;`;
  };
  const onUp = ev => {
    const cx = ev.clientX - rect.left;
    const cy = ev.clientY - rect.top;
    const x = Math.min(startX, cx) / state.zoom;
    const y = Math.min(startY, cy) / state.zoom;
    const w = Math.abs(cx - startX) / state.zoom;
    const h = Math.abs(cy - startY) / state.zoom;
    if (w > 4 || h > 4) {
      const sel = [];
      [...getActiveComponents(), ...getActiveMouseRegions()].forEach(o => {
        if (o.x + o.w > x && o.x < x + w && o.y + o.h > y && o.y < y + h) {
          sel.push(o.id);
        }
      });
      state.selectedIds = sel;
    }
    m.remove();
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    renderAll();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/* ---------- Topbar bindings ---------- */
function bindTopbar() {
  $('#btn-new').onclick = () => {
    if (!confirm('새로 시작하면 현재 작업이 사라집니다. 계속할까요?')) return;
    state.meta = { name: '', description: '', version: SCHEMA_VERSION };
    state.resolutions = [];
    state.bgImage = null;
    state.selectedIds = [];
    addResolution(1920, 1080);
    toast('새 레이아웃을 시작했습니다');
  };

  $('#btn-import').onclick = () => {
    showImportExport(true);
  };
  $('#btn-export').onclick = () => {
    showImportExport(false);
  };

  $('#btn-bg').onclick = () => $('#bg-input').click();
  $('#bg-input').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      state.bgImage = ev.target.result;
      $('#chk-show-bg').checked = true;
      state.bgVisible = true;
      renderCanvasFrame();
      toast('배경 이미지가 로드되었습니다');
    };
    reader.readAsDataURL(file);
  };
  $('#btn-bg-clear').onclick = () => {
    state.bgImage = null;
    renderCanvasFrame();
  };
  $('#chk-show-bg').onchange = e => { state.bgVisible = e.target.checked; renderCanvasFrame(); };

  $('#chk-snap-grid').onchange = e => { state.snap.grid = e.target.checked; };
  $('#chk-snap-elem').onchange = e => { state.snap.elements = e.target.checked; };
  $('#grid-size').onchange = e => { state.snap.gridSize = parseInt(e.target.value) || 10; };

  $('#btn-zoom-in').onclick = () => setZoom(state.zoom * 1.2);
  $('#btn-zoom-out').onclick = () => setZoom(state.zoom / 1.2);
  $('#btn-zoom-fit').onclick = fitZoom;

  $('#btn-add-res').onclick = openResModal;

  $('#meta-name').oninput = e => { state.meta.name = e.target.value; };
  $('#meta-desc').oninput = e => { state.meta.description = e.target.value; };
}

function setZoom(z) {
  state.zoom = Math.max(0.1, Math.min(2, z));
  renderCanvasFrame();
  renderComponents();
}
function fitZoom() {
  const r = getActiveRes();
  if (!r) return;
  const wrap = $('#canvas-wrap');
  const pad = 60;
  const z = Math.min(
    (wrap.clientWidth - pad) / r.width,
    (wrap.clientHeight - pad) / r.height
  );
  setZoom(z);
}

/* ---------- Modals ---------- */
function bindModals() {
  $('#modal-cancel').onclick = () => $('#modal').classList.remove('show');
  $('#modal-copy').onclick = () => {
    navigator.clipboard.writeText($('#modal-text').value).then(() => toast('클립보드에 복사됨'));
  };
  $('#modal-download').onclick = () => {
    const blob = new Blob([$('#modal-text').value], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (state.meta.name || 'gamepad') + '.json';
    a.click();
    URL.revokeObjectURL(url);
  };
  $('#modal-confirm').onclick = () => {
    try {
      const data = JSON.parse($('#modal-text').value);
      loadProject(data);
      $('#modal').classList.remove('show');
      toast('JSON을 불러왔습니다');
    } catch (err) {
      toast('JSON 파싱 오류: ' + err.message, 'error');
    }
  };
  $('#file-input').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      $('#modal-text').value = ev.target.result;
    };
    reader.readAsText(f);
  };

  // Resolution modal
  $('#res-cancel').onclick = () => $('#res-modal').classList.remove('show');
  $('#res-add').onclick = () => {
    const w = parseInt($('#new-w').value);
    const h = parseInt($('#new-h').value);
    const copyFrom = $('#copy-from').value || null;
    if (!w || !h) { toast('해상도를 입력하세요', 'error'); return; }
    if (state.resolutions.find(r => r.width === w && r.height === h)) {
      toast('이미 존재하는 해상도입니다', 'error'); return;
    }
    addResolution(w, h, copyFrom);
    $('#res-modal').classList.remove('show');
    toast(`${w}×${h} 레이아웃 추가됨`);
  };
  $$('.res-preset').forEach(b => {
    b.onclick = () => {
      $('#new-w').value = b.dataset.w;
      $('#new-h').value = b.dataset.h;
    };
  });
}

function openResModal() {
  $('#new-w').value = '';
  $('#new-h').value = '';
  const sel = $('#copy-from');
  sel.innerHTML = '<option value="">(empty)</option>';
  state.resolutions.forEach(r => {
    sel.appendChild(el('option', { value: r.id }, `Copy from ${r.width}×${r.height}`));
  });
  $('#res-modal').classList.add('show');
}

function showImportExport(isImport) {
  $('#modal-title').textContent = isImport ? 'Import JSON' : 'Export JSON';
  $('#modal-text').value = isImport ? '' : JSON.stringify(serializeProject(), null, 2);
  $('#modal-confirm').style.display = isImport ? 'inline-flex' : 'none';
  $('#modal-copy').style.display = isImport ? 'none' : 'inline-flex';
  $('#modal-download').style.display = isImport ? 'none' : 'inline-flex';

  // For import, also offer file picker
  if (isImport) {
    $('#modal-text').placeholder = 'JSON을 붙여넣거나 아래에서 파일을 선택하세요';
    if (!$('#modal-load-file')) {
      const btn = el('button', {
        id: 'modal-load-file',
        class: 'tb-btn',
        onclick: () => $('#file-input').click()
      }, 'Load File…');
      $('.modal-actions').insertBefore(btn, $('#modal-cancel'));
    }
    $('#modal-load-file').style.display = 'inline-flex';
  } else if ($('#modal-load-file')) {
    $('#modal-load-file').style.display = 'none';
  }
  $('#modal').classList.add('show');
}

/* ---------- Serialize / Deserialize ---------- */
function serializeProject() {
  return {
    version: SCHEMA_VERSION,
    meta: { ...state.meta, version: SCHEMA_VERSION },
    // Background image is editor-only and intentionally excluded from exported JSON.
    resolutions: state.resolutions.map(r => ({
      width: r.width,
      height: r.height,
      components: [
        ...r.components.map(serializeComponent),
        ...r.mouseRegions.map(serializeMouseRegionAsComponent)
      ],
      // Backward compatibility for older runtimes/editors that still read this array.
      mouseRegions: r.mouseRegions.map(m => ({
        id: m.id,
        name: m.name || '',
        behavior: m.behavior || 'ignore',
        x: m.x, y: m.y, w: m.w, h: m.h,
        rect: { x: m.x, y: m.y, w: m.w, h: m.h },
        runtime: {
          inputType: 'mouse',
          role: 'mouseFilter',
          behavior: m.behavior || 'ignore',
          multiTouch: true,
          touchIdPolicy: 'shared',
          z: m.z || 0
        },
        style: { shape: 'region' },
        editor: { locked: false }
      }))
    }))
  };
}

function serializeComponent(c) {
  normalizeComponentRuntime(c);
  const typeMap = {
    key: { type: 'button', subtype: 'key' },
    combo: { type: 'button', subtype: 'combo' },
    shoulder: { type: 'button', subtype: 'shoulder' }
  };
  const mapped = typeMap[c.type] || { type: c.type, subtype: c.subtype || 'normal' };
  return {
    id: c.id,
    type: mapped.type,
    originalType: c.type,
    subtype: mapped.subtype,
    label: c.label,
    rect: { x: c.x, y: c.y, w: c.w, h: c.h },
    style: {
      shape: c.shape,
      color: c.color || null,
      bg: c.bg || null,
      mouseIgnore: !!c.mouseIgnore
    },
    runtime: normalizeRuntimeForExport(c),
    editor: {
      locked: !!c.locked
    },
    // Legacy flat fields for compatibility.
    inputType: c.inputType,
    binding: c.binding || '',
    x: c.x, y: c.y, w: c.w, h: c.h,
    shape: c.shape,
    color: c.color || null,
    bg: c.bg || null,
    mouseIgnore: !!c.mouseIgnore,
    locked: !!c.locked
  };
}

function normalizeRuntimeForExport(c) {
  const rt = JSON.parse(JSON.stringify(c.runtime || {}));
  if (c.type === 'stick') {
    rt.deadzone = parseFloat(c.deadzone ?? rt.deadzone ?? 0.15);
    rt.fixed = c.fixed !== false;
  }
  if (c.type === 'trigger') {
    rt.analog = c.analog !== false && c.inputType !== 'keyboard';
  }
  if (typeof rt.range === 'string') {
    rt.range = rt.range.split(',').map(x => parseFloat(x.trim())).filter(n => Number.isFinite(n));
  }
  if (rt.binding && Array.isArray(rt.binding.keys) === false && typeof rt.binding.keys === 'string') {
    rt.binding.keys = splitBindingList(rt.binding.keys);
  }
  if (c.type === 'mouseScroll') {
    rt.inputType = 'mouse';
    rt.role = 'mouseScroll';
    rt.direction = rt.direction || 'vertical';
    rt.step = parseFloat(rt.step ?? 120) || 120;
    rt.sensitivity = parseFloat(rt.sensitivity ?? 1) || 1;
    rt.invert = !!rt.invert;
    rt.momentum = !!rt.momentum;
  }
  return rt;
}

function serializeMouseRegionAsComponent(m) {
  return {
    id: m.id,
    type: 'region',
    originalType: 'mouseRegion',
    subtype: 'mouseFilter',
    label: m.name || 'Mouse Region',
    rect: { x: m.x, y: m.y, w: m.w, h: m.h },
    style: { shape: 'region', color: null, bg: null, mouseIgnore: false },
    runtime: {
      inputType: 'mouse',
      role: 'mouseFilter',
      behavior: m.behavior || 'ignore',
      multiTouch: true,
      touchIdPolicy: 'shared',
      z: m.z || 0
    },
    editor: { locked: false },
    x: m.x, y: m.y, w: m.w, h: m.h
  };
}

function loadProject(data) {
  if (!data || !data.resolutions || !Array.isArray(data.resolutions)) {
    throw new Error('해상도 정보가 없습니다');
  }
  state.meta = data.meta || { name: '', description: '', version: SCHEMA_VERSION };
  // Background images are editor-only. Ignore legacy backgroundImage fields on import.
  state.bgImage = null;
  state.resolutions = data.resolutions.map(r => {
    const res = {
      id: newId('res'),
      width: r.width,
      height: r.height,
      components: [],
      mouseRegions: []
    };
    (r.components || []).forEach(raw => {
      if (raw.originalType === 'mouseRegion' || raw.subtype === 'mouseFilter' || raw.runtime?.role === 'mouseFilter') {
        res.mouseRegions.push(normalizeMouseRegionForImport(raw));
      } else {
        res.components.push(normalizeComponentForImport(raw));
      }
    });
    (r.mouseRegions || []).forEach(raw => {
      if (!res.mouseRegions.some(x => x.id === raw.id)) res.mouseRegions.push(normalizeMouseRegionForImport(raw));
    });
    return res;
  });
  state.activeResId = state.resolutions[0]?.id || null;
  state.selectedIds = [];
  renderAll();
}

function normalizeComponentForImport(raw) {
  const rect = raw.rect || { x: raw.x ?? 0, y: raw.y ?? 0, w: raw.w ?? 80, h: raw.h ?? 80 };
  const style = raw.style || {};
  const originalType = raw.originalType || (raw.type === 'button' && raw.subtype && raw.subtype !== 'normal' ? raw.subtype : raw.type);
  const type = COMPONENT_TYPES[originalType] ? originalType : (COMPONENT_TYPES[raw.type] ? raw.type : 'button');
  const c = {
    id: raw.id || newId('c'),
    type,
    subtype: raw.subtype || 'normal',
    label: raw.label || COMPONENT_TYPES[type]?.defaultLabel || '',
    inputType: raw.inputType || raw.runtime?.inputType || COMPONENT_TYPES[type]?.inputType || 'controller',
    binding: raw.binding || '',
    x: rect.x, y: rect.y, w: rect.w, h: rect.h,
    shape: style.shape || raw.shape || COMPONENT_TYPES[type]?.shape || 'square',
    color: style.color || raw.color || '',
    bg: style.bg || raw.bg || '',
    mouseIgnore: style.mouseIgnore ?? raw.mouseIgnore ?? false,
    locked: raw.editor?.locked ?? raw.locked ?? false,
    runtime: JSON.parse(JSON.stringify(raw.runtime || {})),
    z: raw.runtime?.z || raw.z || 0
  };
  if (type === 'stick') { c.deadzone = raw.runtime?.deadzone ?? raw.deadzone ?? 0.15; c.fixed = raw.runtime?.fixed ?? raw.fixed ?? true; }
  if (type === 'trigger') { c.analog = raw.runtime?.analog ?? raw.analog ?? true; }
  normalizeComponentRuntime(c);
  return c;
}

function normalizeMouseRegionForImport(raw) {
  const rect = raw.rect || { x: raw.x ?? 0, y: raw.y ?? 0, w: raw.w ?? 200, h: raw.h ?? 200 };
  return {
    id: raw.id || newId('mr'),
    name: raw.name || raw.label || 'Mouse Region',
    behavior: raw.behavior || raw.runtime?.behavior || 'ignore',
    x: rect.x, y: rect.y, w: rect.w, h: rect.h,
    z: raw.runtime?.z || raw.z || 0
  };
}

/* ---------- Alignment & distribution ---------- */
function bindAlignButtons() {
  const sel = () => {
    const all = [...getActiveComponents(), ...getActiveMouseRegions()];
    return all.filter(o => state.selectedIds.includes(o.id) && !o.locked);
  };

  $('#align-l').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const minX = Math.min(...items.map(i => i.x));
    items.forEach(i => i.x = minX);
    renderAll();
  };
  $('#align-r').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const maxR = Math.max(...items.map(i => i.x + i.w));
    items.forEach(i => i.x = maxR - i.w);
    renderAll();
  };
  $('#align-t').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const minY = Math.min(...items.map(i => i.y));
    items.forEach(i => i.y = minY);
    renderAll();
  };
  $('#align-b').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const maxB = Math.max(...items.map(i => i.y + i.h));
    items.forEach(i => i.y = maxB - i.h);
    renderAll();
  };
  $('#align-cx').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const cx = items.reduce((s, i) => s + i.x + i.w / 2, 0) / items.length;
    items.forEach(i => i.x = Math.round(cx - i.w / 2));
    renderAll();
  };
  $('#align-cy').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const cy = items.reduce((s, i) => s + i.y + i.h / 2, 0) / items.length;
    items.forEach(i => i.y = Math.round(cy - i.h / 2));
    renderAll();
  };
  $('#dist-h').onclick = () => {
    const items = sel(); if (items.length < 3) return;
    items.sort((a, b) => a.x - b.x);
    const left = items[0].x;
    const right = items[items.length - 1].x + items[items.length - 1].w;
    const totalW = items.reduce((s, i) => s + i.w, 0);
    const gap = (right - left - totalW) / (items.length - 1);
    let cur = left;
    items.forEach(i => { i.x = Math.round(cur); cur += i.w + gap; });
    renderAll();
  };
  $('#dist-v').onclick = () => {
    const items = sel(); if (items.length < 3) return;
    items.sort((a, b) => a.y - b.y);
    const top = items[0].y;
    const bot = items[items.length - 1].y + items[items.length - 1].h;
    const totalH = items.reduce((s, i) => s + i.h, 0);
    const gap = (bot - top - totalH) / (items.length - 1);
    let cur = top;
    items.forEach(i => { i.y = Math.round(cur); cur += i.h + gap; });
    renderAll();
  };
}

/* ---------- Keyboard shortcuts ---------- */
function bindKeyboard() {
  document.addEventListener('keydown', e => {
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (state.selectedIds.length) { e.preventDefault(); deleteSelected(); }
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
      e.preventDefault(); duplicateSelected();
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
      e.preventDefault();
      state.selectedIds = [...getActiveComponents().map(c => c.id), ...getActiveMouseRegions().map(m => m.id)];
      renderAll();
    } else if (e.key === 'Escape') {
      state.selectedIds = []; renderAll();
    } else if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key) && state.selectedIds.length) {
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
      const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
      moveSelected(dx, dy);
      renderAll();
    } else if (e.key === '+' || e.key === '=') {
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(state.zoom * 1.2); }
    } else if (e.key === '-') {
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(state.zoom / 1.2); }
    }
  });
}

/* ---------- Boot ---------- */
window.addEventListener('DOMContentLoaded', () => {
  init();
  setTimeout(fitZoom, 100);
});
