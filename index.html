<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Virtual Gamepad Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- interact.js for drag/resize and snapping -->
<script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
<style>
:root {
  --bg: #f8fafc;
  --bg-2: #ffffff;
  --bg-3: #f1f5f9;
  --panel: #ffffff;
  --panel-soft: #fbfdff;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #1e293b;
  --text-dim: #64748b;
  --text-mute: #94a3b8;
  --accent: #2563eb;
  --accent-2: #38bdf8;
  --accent-soft: #dbeafe;
  --kb: #0284c7;
  --pad: #8b5cf6;
  --danger: #ef4444;
  --danger-soft: #fee2e2;
  --ok: #10b981;
  --warn: #f59e0b;

  --shadow-1: 0 1px 0 rgba(255,255,255,0.95) inset, 0 8px 24px rgba(15,23,42,0.08);
  --shadow-2: 0 18px 48px rgba(15,23,42,0.12);
  --grid: rgba(148,163,184,0.28);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  font-size: 13px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

button { font-family: inherit; }

/* ===================== LAYOUT ===================== */
.app {
  display: grid;
  grid-template-columns: 240px 1fr 300px;
  grid-template-rows: 48px 1fr 28px;
  height: 100vh;
  width: 100vw;
}

.topbar {
  grid-column: 1 / 4;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.brand {
  font-weight: 700;
  letter-spacing: 0.02em;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: 6px;
}
.brand-dot {
  width: 10px; height: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 2px;
  transform: rotate(45deg);
}

.tb-divider {
  width: 1px; height: 24px;
  background: var(--border);
  margin: 0 4px;
}

.tb-btn {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.tb-btn:hover { background: var(--bg-3); border-color: var(--border-strong); }
.tb-btn.primary {
  background: linear-gradient(180deg, var(--accent), #1d4ed8);
  color: #ffffff;
  border-color: transparent;
  font-weight: 600;
}
.tb-btn.primary:hover { filter: brightness(1.08); }
.tb-btn.danger { color: var(--danger); }

.tb-spacer { flex: 1; }

.tb-select, .tb-input {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
}
.tb-input { width: 80px; }

/* Sidebar (palette) */
.sidebar-left {
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 14px 12px;
}

.section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-mute);
  margin: 4px 0 10px 4px;
}

.palette {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}
.palette-item {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px 8px;
  cursor: grab;
  text-align: center;
  transition: all 0.15s;
  font-size: 11px;
  color: var(--text-dim);
}
.palette-item:hover {
  border-color: var(--accent);
  background: var(--bg-3);
  color: var(--text);
  transform: translateY(-1px);
}
.palette-item.dragging { opacity: 0.5; }
.palette-item.mouse-region-item {
  border-color: #fecaca;
  color: var(--danger);
}
.palette-item.mouse-region-item:hover {
  border-color: var(--danger);
}
.palette-icon {
  width: 36px; height: 36px;
  margin: 0 auto 4px;
  display: flex; align-items: center; justify-content: center;
}
.palette-icon svg { width: 100%; height: 100%; }

/* Canvas */
.canvas-wrap {
  position: relative;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 20px 20px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 20px 20px,
    radial-gradient(ellipse at center, #ffffff 0%, #f1f5f9 72%, #eaf0f8 100%);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.canvas-frame {
  position: relative;
  background: #ffffff;
  box-shadow: var(--shadow-2), 0 0 0 1px var(--border-strong);
  /* size set by JS based on resolution and zoom */
}

.canvas-bg-image {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  pointer-events: none;
  opacity: 0.6;
}

.canvas-overlay {
  position: absolute; inset: 0;
  pointer-events: auto;
}

/* Snap guidelines */
.guide {
  position: absolute;
  background: var(--accent);
  pointer-events: none;
  z-index: 100;
  box-shadow: 0 0 4px var(--accent);
}
.guide.h { height: 1px; left: 0; right: 0; }
.guide.v { width: 1px; top: 0; bottom: 0; }

/* Components on canvas */
.gp-component {
  position: absolute;
  touch-action: none;
  cursor: move;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #cbd5e1;
  background: rgba(255, 255, 255, 0.94);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  user-select: none;
  backdrop-filter: blur(2px);
  transition: border-color 0.12s, box-shadow 0.12s;
}
.gp-component.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.18), 0 10px 26px rgba(37,99,235,0.20);
  z-index: 50;
}
.gp-component.locked { opacity: 0.65; cursor: not-allowed; }

.gp-component.shape-circle { border-radius: 50%; }
.gp-component.shape-pill { border-radius: 999px; }
.gp-component.shape-square { border-radius: 8px; }
.gp-component.shape-region { border-style: dashed; background: #f0f9ff; }

/* Color hint by input type */
.gp-component[data-input-type="keyboard"] { border-color: #7dd3fc; }
.gp-component[data-input-type="controller"] { border-color: #c4b5fd; }
.gp-component.selected[data-input-type] { border-color: var(--accent); }

/* Handles */
.gp-component .resize-handle,
.mouse-region .resize-handle {
  position: absolute;
  width: 12px; height: 12px;
  background: var(--accent);
  border: 1.5px solid #ffffff;
  border-radius: 2px;
  z-index: 60;
}
.gp-component .resize-handle.se, .mouse-region .resize-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
.gp-component .resize-handle.sw, .mouse-region .resize-handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
.gp-component .resize-handle.ne, .mouse-region .resize-handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
.gp-component .resize-handle.nw, .mouse-region .resize-handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }

/* Mouse-ignore visualization */
.gp-component.mouse-ignore {
  background-image:
    repeating-linear-gradient(
      45deg,
      rgba(239, 68, 68, 0.14) 0,
      rgba(239, 68, 68, 0.14) 6px,
      transparent 6px,
      transparent 12px
    );
}
.gp-component .badge {
  position: absolute;
  top: -8px; left: -2px;
  font-size: 9px;
  padding: 1px 5px;
  background: var(--bg-3);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}
.gp-component .badge.kb { color: var(--kb); border-color: var(--kb); }
.gp-component .badge.pad { color: var(--pad); border-color: var(--pad); }

/* Selection box for marquee */
.marquee {
  position: absolute;
  border: 1px dashed var(--accent);
  background: rgba(37,99,235,0.08);
  pointer-events: none;
  z-index: 90;
}

/* Sidebar (inspector) */
.sidebar-right {
  background: var(--panel);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 14px 12px;
}

.field {
  margin-bottom: 12px;
}
.field-label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-mute);
  margin-bottom: 5px;
  font-weight: 600;
}
.field-row { display: flex; gap: 6px; }
.field-row .tb-input { flex: 1; width: auto; }

.input-text, .input-num, .input-select {
  width: 100%;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 5px;
  font-size: 12px;
  font-family: inherit;
}
.input-text:focus, .input-num:focus, .input-select:focus {
  outline: none;
  border-color: var(--accent);
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 12px;
  padding: 4px 0;
  color: var(--text-dim);
}
.checkbox input { accent-color: var(--accent); }

.btn-group {
  display: flex;
  gap: 4px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px;
}
.btn-group button {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 5px 6px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  transition: all 0.12s;
}
.btn-group button:hover { color: var(--text); }
.btn-group button.active {
  background: var(--bg-3);
  color: var(--accent);
}

.empty-inspector {
  text-align: center;
  padding: 30px 10px;
  color: var(--text-mute);
  font-size: 12px;
  line-height: 1.6;
}

/* Statusbar */
.statusbar {
  grid-column: 1 / 4;
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 14px;
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}
.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok);
}

/* Resolution tabs */
.res-tabs {
  display: flex;
  gap: 2px;
  background: var(--bg-2);
  border-radius: 6px;
  padding: 2px;
  border: 1px solid var(--border);
}
.res-tab {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
}
.res-tab:hover { color: var(--text); }
.res-tab.active { background: var(--bg-3); color: var(--accent); }
.res-tab .x {
  margin-left: 6px;
  color: var(--text-mute);
  cursor: pointer;
}
.res-tab .x:hover { color: var(--danger); }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.18);
  display: none;
  align-items: center; justify-content: center;
  z-index: 1000;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 20px;
  width: min(540px, 90vw);
  max-height: 80vh;
  overflow: auto;
  box-shadow: var(--shadow-2);
}
.modal h2 {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 600;
}
.modal textarea {
  width: 100%;
  min-height: 280px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  resize: vertical;
}
.modal-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  margin-top: 12px;
}

/* Help icon tooltip */
.help-tip {
  display: inline-block;
  margin-left: 5px;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--bg-3);
  color: var(--text-mute);
  font-size: 9px;
  text-align: center;
  line-height: 13px;
  cursor: help;
  font-weight: 700;
}

/* Mouse-ignore region overlay */
.mouse-region {
  position: absolute;
  border: 2px dashed var(--danger);
  background: rgba(254, 226, 226, 0.68);
  pointer-events: auto;
  cursor: move;
}
.mouse-region.selected {
  border-color: var(--accent);
  background: rgba(219, 234, 254, 0.74);
}
.mouse-region .label {
  position: absolute;
  top: 4px; left: 6px;
  font-size: 10px;
  color: var(--danger);
  font-weight: 600;
  background: #ffffff;
  padding: 1px 5px;
  border-radius: 3px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* Subtle drag state */
.dragging-active * { cursor: grabbing !important; }

/* Resolution preset picker */
.res-presets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 10px;
}
.res-preset {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  text-align: left;
  font-family: 'JetBrains Mono', monospace;
}
.res-preset:hover { border-color: var(--accent); }

.zoom-pill {
  display: flex; align-items: center; gap: 4px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px;
}
.zoom-pill button {
  background: transparent; border: none; color: var(--text);
  width: 22px; height: 22px; border-radius: 3px; cursor: pointer; font-size: 13px;
}
.zoom-pill button:hover { background: var(--bg-3); }
.zoom-pill .val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text-dim);
  padding: 0 6px; min-width: 38px; text-align: center;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 40px; left: 50%;
  transform: translateX(-50%);
  background: var(--bg-3);
  border: 1px solid var(--border-strong);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text);
  box-shadow: var(--shadow-2);
  z-index: 2000;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* Visual key icon for input type */
.input-type-toggle {
  display: flex;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.input-type-toggle button {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 6px;
  cursor: pointer;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.input-type-toggle button.active.kb { background: #e0f2fe; color: var(--kb); }
.input-type-toggle button.active.pad { background: #ede9fe; color: var(--pad); }

/* Polished white theme refinements */
.topbar, .sidebar-left, .sidebar-right, .statusbar {
  box-shadow: var(--shadow-1);
}
.palette-item, .tb-btn, .input-text, .input-num, .input-select, .res-preset, .zoom-pill, .btn-group {
  box-shadow: 0 1px 2px rgba(15,23,42,0.03);
}
.palette-item:hover, .tb-btn:hover, .res-preset:hover {
  box-shadow: 0 6px 16px rgba(15,23,42,0.08);
}
.canvas-frame {
  border-radius: 8px;
}
.gp-component {
  box-shadow: 0 4px 14px rgba(15,23,42,0.08);
}
.gp-component.selected {
  box-shadow: 0 0 0 3px rgba(37,99,235,0.18), 0 10px 26px rgba(37,99,235,0.20);
}
.gp-component .resize-handle,
.mouse-region .resize-handle {
  box-shadow: 0 1px 4px rgba(15,23,42,0.18);
}
.mouse-region {
  border-color: #f87171;
}
.mouse-region .label {
  border: 1px solid #fecaca;
}
.toast {
  background: #ffffff;
}
.modal textarea {
  background: #fbfdff;
}
</style>
</head>
<body>

<div class="app">

  <!-- ============ TOP BAR ============ -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>VIRTUAL GAMEPAD EDITOR</span>
    </div>

    <div class="tb-divider"></div>

    <button class="tb-btn" id="btn-new" title="새 레이아웃">⊕ New</button>
    <button class="tb-btn" id="btn-import">↓ Import JSON</button>
    <button class="tb-btn primary" id="btn-export">↑ Export JSON</button>

    <div class="tb-divider"></div>

    <button class="tb-btn" id="btn-bg">🖼 Background</button>
    <button class="tb-btn" id="btn-bg-clear" title="배경 제거" style="padding: 6px 8px;">✕</button>
    <label class="checkbox" style="margin-left: 4px;">
      <input type="checkbox" id="chk-show-bg" checked /> Show
    </label>

    <div class="tb-divider"></div>

    <span style="font-size: 11px; color: var(--text-mute);">SNAP</span>
    <label class="checkbox"><input type="checkbox" id="chk-snap-grid" checked /> Grid</label>
    <label class="checkbox"><input type="checkbox" id="chk-snap-elem" checked /> Elements</label>
    <input type="number" id="grid-size" class="tb-input" value="10" min="1" max="100" style="width: 50px;" title="Grid size (px)" />

    <div class="tb-spacer"></div>

    <div class="zoom-pill">
      <button id="btn-zoom-out">−</button>
      <span class="val" id="zoom-val">50%</span>
      <button id="btn-zoom-in">+</button>
      <button id="btn-zoom-fit" style="width: auto; padding: 0 6px; font-size: 11px;">FIT</button>
    </div>
  </div>

  <!-- ============ LEFT SIDEBAR (palette) ============ -->
  <div class="sidebar-left">
    <div class="section-title">Components</div>
    <div class="palette" id="palette"></div>

    <div class="section-title">Layout Meta</div>
    <div class="field">
      <label class="field-label">Layout name</label>
      <input type="text" id="meta-name" class="input-text" placeholder="My Gamepad" />
    </div>
    <div class="field">
      <label class="field-label">Description</label>
      <input type="text" id="meta-desc" class="input-text" placeholder="optional" />
    </div>

    <div class="section-title">Resolution Layouts</div>
    <div id="res-list" style="display: flex; flex-direction: column; gap: 5px;"></div>
    <button class="tb-btn" id="btn-add-res" style="width: 100%; margin-top: 8px; justify-content: center;">+ Add resolution</button>

    <div class="section-title" style="margin-top: 18px;">Distribute</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
      <button class="tb-btn" id="dist-h" title="가로 균등 분배">⇆ Horiz</button>
      <button class="tb-btn" id="dist-v" title="세로 균등 분배">⇅ Vert</button>
      <button class="tb-btn" id="align-l" title="왼쪽 정렬">⊢ Left</button>
      <button class="tb-btn" id="align-r" title="오른쪽 정렬">⊣ Right</button>
      <button class="tb-btn" id="align-t" title="위 정렬">⊤ Top</button>
      <button class="tb-btn" id="align-b" title="아래 정렬">⊥ Bot</button>
      <button class="tb-btn" id="align-cx" title="가로 중앙">↕ CenH</button>
      <button class="tb-btn" id="align-cy" title="세로 중앙">↔ CenV</button>
    </div>
  </div>

  <!-- ============ CANVAS ============ -->
  <div class="canvas-wrap" id="canvas-wrap">
    <div class="canvas-frame" id="canvas-frame">
      <img class="canvas-bg-image" id="canvas-bg" style="display: none;" />
      <div class="canvas-overlay" id="canvas-overlay"></div>
    </div>
  </div>

  <!-- ============ RIGHT SIDEBAR (inspector) ============ -->
  <div class="sidebar-right" id="inspector">
    <div class="empty-inspector">
      Select a component on the canvas<br />
      to edit its properties.<br /><br />
      <span style="color: var(--text-mute); font-size: 11px;">Drag from the palette to add new ones.</span>
    </div>
  </div>

  <!-- ============ STATUS BAR ============ -->
  <div class="statusbar">

<script>
/* ===================================================================
   PART 2 — APPLICATION LOGIC
   =================================================================== */

/* ---------- Component definitions ---------- */
const COMPONENT_TYPES = {

const PALETTE_ICONS = {

  touchpad: '<svg viewBox="0 0 40 40"><rect x="6" y="10" width="28" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="2" fill="currentColor"/></svg>',
  mouseScroll: '<svg viewBox="0 0 40 40"><rect x="13" y="6" width="14" height="28" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 11v7M20 22v7M17 15l3 3 3-3M17 25l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  region: '<svg viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/></svg>',
  mouseRegion: '<svg viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="2" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/><path d="M14 14 L20 20 L14 22 L18 26" fill="none" stroke="#ef4444" stroke-width="1.5"/></svg>'
};


/* ---------- Standardized binding code lists ----------
   Keyboard: W3C/MDN KeyboardEvent.code values (physical key position).
   Gamepad: W3C Gamepad API Standard Gamepad canonical order, exposed here as
            readable aliases plus index-based codes for unambiguous runtimes.
---------- */
const KEYBOARD_CODE_OPTIONS = [
  'Escape','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12','PrintScreen','ScrollLock','Pause',
  'Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal','Backspace',
  'Tab','KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash',
  'CapsLock','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote','Enter',
  'ShiftLeft','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash','ShiftRight',
  'ControlLeft','MetaLeft','AltLeft','Space','AltRight','MetaRight','ContextMenu','ControlRight',
  'Insert','Home','PageUp','Delete','End','PageDown','ArrowUp','ArrowLeft','ArrowDown','ArrowRight',
  'NumLock','NumpadDivide','NumpadMultiply','NumpadSubtract','Numpad7','Numpad8','Numpad9','NumpadAdd',
  'Numpad4','Numpad5','Numpad6','Numpad1','Numpad2','Numpad3','NumpadEnter','Numpad0','NumpadDecimal',
  'IntlBackslash','IntlRo','IntlYen','KanaMode','Lang1','Lang2','Lang3','Lang4','Lang5','Convert','NonConvert'
];

const CONTROLLER_BUTTON_OPTIONS = [
  // Human-friendly aliases for Standard Gamepad buttons.
  'A','B','X','Y','LB','RB','LT','RT','Back','Start','Select','Menu','LeftStickButton','RightStickButton','LS','RS',
  'DPadUp','DPadDown','DPadLeft','DPadRight','Guide','Home',
  // Index-based canonical codes from the W3C standard layout.
  'Button0','Button1','Button2','Button3','Button4','Button5','Button6','Button7','Button8','Button9','Button10','Button11','Button12','Button13','Button14','Button15','Button16'
];

const CONTROLLER_AXIS_OPTIONS = [
  'LeftStickX','LeftStickY','RightStickX','RightStickY','Axis0','Axis1','Axis2','Axis3'
];

// Mouse: based on MouseEvent.button (0~4) and MouseEvent.buttons bitmask (1,2,4,8,16).
// Human-friendly names are exported by default, while index/mask aliases are offered for unambiguous runtimes.
const MOUSE_BUTTON_OPTIONS = [
  'MouseLeft','MouseMiddle','MouseRight','MouseBack','MouseForward',
  'MouseButton0','MouseButton1','MouseButton2','MouseButton3','MouseButton4'
];
const MOUSE_BUTTON_MASK_OPTIONS = [
  'MouseButtons1','MouseButtons2','MouseButtons4','MouseButtons8','MouseButtons16',
  'MouseMaskLeft','MouseMaskRight','MouseMaskMiddle','MouseMaskBack','MouseMaskForward'
];
const MOUSE_CODE_OPTIONS = [
  ...MOUSE_BUTTON_OPTIONS,
  ...MOUSE_BUTTON_MASK_OPTIONS,
  'MouseX','MouseY','MouseWheelX','MouseWheelY','MouseWheelUp','MouseWheelDown','MouseWheelLeft','MouseWheelRight'
];
const TOUCH_CODE_OPTIONS = ['TouchX','TouchY','TouchPress','Touch0X','Touch0Y','Touch1X','Touch1Y'];

function ensureDatalist(id, values) {
  let list = document.getElementById(id);
  if (!list) {
    list = document.createElement('datalist');
    list.id = id;
    document.body.appendChild(list);
  }
  list.innerHTML = '';
  [...new Set(values)].forEach(v => list.appendChild(el('option', { value: v })));
}

function buildBindingDatalists() {
  ensureDatalist('keyboard-code-list', KEYBOARD_CODE_OPTIONS);
  ensureDatalist('controller-button-list', CONTROLLER_BUTTON_OPTIONS);
  ensureDatalist('controller-axis-list', CONTROLLER_AXIS_OPTIONS);
  ensureDatalist('controller-any-list', [...CONTROLLER_BUTTON_OPTIONS, ...CONTROLLER_AXIS_OPTIONS]);
  ensureDatalist('mouse-button-list', MOUSE_BUTTON_OPTIONS);
  ensureDatalist('mouse-buttons-mask-list', MOUSE_BUTTON_MASK_OPTIONS);
  ensureDatalist('mouse-code-list', MOUSE_CODE_OPTIONS);
  ensureDatalist('touch-code-list', TOUCH_CODE_OPTIONS);
  ensureDatalist('input-code-list', [...KEYBOARD_CODE_OPTIONS, ...CONTROLLER_BUTTON_OPTIONS, ...CONTROLLER_AXIS_OPTIONS, ...MOUSE_CODE_OPTIONS, ...TOUCH_CODE_OPTIONS]);
}

function bindingListFor(c, path) {
  const inputType = c?.inputType || c?.runtime?.inputType || 'controller';
  if (path === 'binding.keys') return 'keyboard-code-list';
  if (path === 'binding.buttons') return inputType === 'mouse' ? 'mouse-button-list' : 'keyboard-code-list';
  if (path === 'binding.button' && inputType === 'mouse') return 'mouse-button-list';
  if (inputType === 'keyboard') return 'keyboard-code-list';
  if (inputType === 'mouse') return 'mouse-code-list';
  if (path === 'binding.axis' || path === 'binding.axisX' || path === 'binding.axisY') return 'controller-axis-list';
  if (path.startsWith('binding.') || path.startsWith('bindings.')) return inputType === 'controller' ? 'controller-button-list' : 'keyboard-code-list';
  if (path.includes('gestures.')) return 'input-code-list';
  return '';
}

/* ---------- State ---------- */
const SCHEMA_VERSION = '1.1';

const state = {
  meta: { name: '', description: '', version: SCHEMA_VERSION },
  resolutions: [],            // [{ id, width, height, components: [], mouseRegions: [] }]
  activeResId: null,
  selectedIds: [],            // selected component ids
  zoom: 0.5,
  bgImage: null,              // dataURL
  bgVisible: true,
  snap: { grid: true, elements: true, gridSize: 10 },
  dragGuides: { x: null, y: null }
};

let dragSession = null;

let _idCounter = 1;
const newId = (prefix = 'c') => `${prefix}_${Date.now().toString(36)}_${(_idCounter++).toString(36)}`;

/* ---------- DOM helpers ---------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const el = (tag, attrs = {}, children = []) => {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'style') e.style.cssText = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'dataset') Object.assign(e.dataset, attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};

function toast(msg, type = 'ok') {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('error', type === 'error');
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Active resolution helpers ---------- */
function getActiveRes() {
  return state.resolutions.find(r => r.id === state.activeResId);
}
function getActiveComponents() {
  const r = getActiveRes();
  return r ? r.components : [];
}
function getActiveMouseRegions() {
  const r = getActiveRes();
  return r ? r.mouseRegions : [];
}

/* ---------- Initialization ---------- */
function init() {
  buildBindingDatalists();
  buildPalette();
  bindTopbar();
  bindModals();
  bindCanvas();
  bindKeyboard();
  bindAlignButtons();

  // First resolution by default
  if (state.resolutions.length === 0) {
    addResolution(1920, 1080);
  }
  renderAll();
}

/* ---------- Build palette ---------- */
function buildPalette() {
  const palette = $('#palette');
  palette.innerHTML = '';
  for (const [type, def] of Object.entries(COMPONENT_TYPES)) {
    const item = el('div', {
      class: 'palette-item' + (def.isMouseRegion ? ' mouse-region-item' : ''),
      title: def.description,
      dataset: { type },
      draggable: 'true'
    }, [
      el('div', { class: 'palette-icon' }, []),
      def.label
    ]);
    item.querySelector('.palette-icon').innerHTML = PALETTE_ICONS[type] || '';
    item.addEventListener('dragstart', e => {
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/component-type', type);
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    palette.appendChild(item);
  }
}

/* ---------- Resolution management ---------- */
function addResolution(w, h, copyFromId = null) {
  const id = newId('res');
  const newRes = {
    id,
    width: w,
    height: h,
    components: [],
    mouseRegions: []
  };
  if (copyFromId) {
    const src = state.resolutions.find(r => r.id === copyFromId);
    if (src) {
      // Scale components proportionally
      const sx = w / src.width;
      const sy = h / src.height;
      newRes.components = src.components.map(c => ({
        ...JSON.parse(JSON.stringify(c)),
        id: newId('c'),
        x: Math.round(c.x * sx),
        y: Math.round(c.y * sy),
        w: Math.round(c.w * sx),
        h: Math.round(c.h * sy)
      }));
      newRes.mouseRegions = src.mouseRegions.map(r => ({
        ...JSON.parse(JSON.stringify(r)),
        id: newId('mr'),
        x: Math.round(r.x * sx),
        y: Math.round(r.y * sy),
        w: Math.round(r.w * sx),
        h: Math.round(r.h * sy)
      }));
    }
  }
  state.resolutions.push(newRes);
  state.activeResId = id;
  state.selectedIds = [];
  renderAll();
}

function removeResolution(id) {
  if (state.resolutions.length <= 1) {
    toast('적어도 하나의 해상도는 있어야 합니다', 'error');
    return;
  }
  if (!confirm('이 해상도 레이아웃을 삭제하시겠습니까?')) return;
  state.resolutions = state.resolutions.filter(r => r.id !== id);
  if (state.activeResId === id) {
    state.activeResId = state.resolutions[0].id;
    state.selectedIds = [];
  }
  renderAll();
}

function switchResolution(id) {
  state.activeResId = id;
  state.selectedIds = [];
  renderAll();
}

/* ---------- Render: resolution tabs ---------- */
function renderResolutionTabs() {
  const list = $('#res-list');
  list.innerHTML = '';
  state.resolutions.forEach(r => {
    const isActive = r.id === state.activeResId;
    const tab = el('div', {
      class: 'tb-btn' + (isActive ? ' primary' : ''),
      style: 'width: 100%; justify-content: space-between; padding: 6px 10px;',
      onclick: () => switchResolution(r.id)
    }, [
      el('span', {}, `${r.width}×${r.height}`),
      el('span', {
        style: 'opacity: 0.6; cursor: pointer; padding: 0 4px;',
        title: '삭제',
        onclick: e => { e.stopPropagation(); removeResolution(r.id); }
      }, '✕')
    ]);
    list.appendChild(tab);
  });
}

/* ---------- Render: canvas frame ---------- */
function renderCanvasFrame() {
  const r = getActiveRes();
  const frame = $('#canvas-frame');
  if (!r) return;
  frame.style.width = (r.width * state.zoom) + 'px';
  frame.style.height = (r.height * state.zoom) + 'px';
  $('#status-res').textContent = `${r.width} × ${r.height}`;
  $('#zoom-val').textContent = Math.round(state.zoom * 100) + '%';

  const bg = $('#canvas-bg');
  if (state.bgImage && state.bgVisible) {
    bg.src = state.bgImage;
    bg.style.display = 'block';
  } else {
    bg.style.display = 'none';
  }
}

/* ---------- Render: components ---------- */
function renderComponents() {
  const r = getActiveRes();
  const overlay = $('#canvas-overlay');
  overlay.innerHTML = '';
  if (!r) return;

  // mouse regions first (lower z)
  [...r.mouseRegions].sort((a,b)=>(a.z||0)-(b.z||0)).forEach(mr => {
    const div = el('div', {
      class: 'mouse-region' + (state.selectedIds.includes(mr.id) ? ' selected' : ''),
      dataset: { id: mr.id, kind: 'mouseRegion' },
      style: `left:${mr.x * state.zoom}px; top:${mr.y * state.zoom}px;
              width:${mr.w * state.zoom}px; height:${mr.h * state.zoom}px; z-index:${mr.z || 0};`
    }, [
      el('span', { class: 'label' }, `MOUSE ${mr.behavior === 'ignore' ? 'IGNORE' : 'PASS'}`),
      // resize handles for selected mouse regions
      ...(state.selectedIds.includes(mr.id)
        ? ['nw','ne','sw','se'].map(p => el('div', { class: `resize-handle ${p}` }))
        : [])
    ]);
    overlay.appendChild(div);
  });

  [...r.components].sort((a,b)=>((a.runtime?.z ?? a.z ?? 0)- (b.runtime?.z ?? b.z ?? 0))).forEach(c => {
    const def = COMPONENT_TYPES[c.type] || {};
    const shape = c.shape || def.shape || 'square';
    const div = el('div', {
      class: `gp-component shape-${shape} ${state.selectedIds.includes(c.id) ? 'selected' : ''} ${c.locked ? 'locked' : ''} ${c.mouseIgnore ? 'mouse-ignore' : ''}`,
      dataset: {
        id: c.id,
        kind: 'component',
        inputType: c.inputType || c.runtime?.inputType || 'controller'
      },
      style: `left:${c.x * state.zoom}px; top:${c.y * state.zoom}px;
              width:${c.w * state.zoom}px; height:${c.h * state.zoom}px;
              font-size:${Math.max(10, Math.min(c.w, c.h) * state.zoom * 0.22)}px;
              ${c.color ? `border-color:${c.color};` : ''}
              ${c.bg ? `background:${c.bg};` : ''}
              z-index:${c.runtime?.z ?? c.z ?? 0};`
    }, [
      el('span', { class: 'badge ' + (c.inputType === 'keyboard' ? 'kb' : 'pad') }, c.inputType === 'keyboard' ? 'KB' : (c.inputType === 'mouse' ? 'MOUSE' : 'PAD')),
      el('span', { class: 'label' }, c.label || ''),
      ...(state.selectedIds.includes(c.id) && !c.locked
        ? ['nw','ne','sw','se'].map(p => el('div', { class: `resize-handle ${p}` }))
        : [])
    ]);
    overlay.appendChild(div);
  });

  setupInteractions();
}

function renderAll() {
  renderResolutionTabs();
  renderCanvasFrame();
  renderComponents();
  renderInspector();
  $('#status-count').textContent = `${getActiveComponents().length} components, ${getActiveMouseRegions().length} regions`;
  $('#meta-name').value = state.meta.name || '';
  $('#meta-desc').value = state.meta.description || '';
}

/* ---------- Inspector ---------- */
function renderInspector() {
  const insp = $('#inspector');
  insp.innerHTML = '';

  if (state.selectedIds.length === 0) {
    insp.innerHTML = `<div class="empty-inspector">
      Select a component on the canvas<br />
      to edit its properties.<br /><br />
      <span style="color: var(--text-mute); font-size: 11px;">
        Drag from the palette to add new ones.<br/>
        Hold <b>Shift</b> for multi-select.<br/>
        <b>Del</b> to remove. <b>Ctrl+D</b> to duplicate.
      </span>
    </div>`;
    return;
  }

  if (state.selectedIds.length > 1) {
    insp.innerHTML = `<div class="section-title">${state.selectedIds.length} selected</div>
      <div class="empty-inspector" style="padding: 10px;">Use the alignment & distribute buttons in the left panel.</div>`;
    return;
  }

  const id = state.selectedIds[0];
  const isMouseRegion = id.startsWith('mr_');
  if (isMouseRegion) {
    renderMouseRegionInspector(id);
    return;
  }

  const c = getActiveComponents().find(x => x.id === id);
  if (!c) return;
  const def = COMPONENT_TYPES[c.type] || {};

  const wrap = el('div');
  wrap.appendChild(el('div', { class: 'section-title' }, `${def.label || c.type} • ${c.id.slice(-6)}`));

  normalizeComponentRuntime(c);

  // Input target
  const clickCapableTypes = ['button','key','combo','shoulder','trigger'];
  const inputOptions = c.type === 'mouseScroll'
    ? [['mouse','Mouse']]
    : ((c.type === 'touchpad' || clickCapableTypes.includes(c.type))
      ? [['controller','Controller'], ['keyboard','Keyboard'], ['mouse','Mouse']]
      : [['controller','Controller'], ['keyboard','Keyboard']]);
  wrap.appendChild(makeSelectField('Input target', c.inputType || c.runtime?.inputType || 'controller', inputOptions,
    v => { setComponentInputType(c, v); renderAll(); }));

  // Label
  wrap.appendChild(makeTextField('Label', c.label || '', v => { c.label = v; renderComponents(); }));

  renderRuntimeInspectorFields(wrap, c);

  // Position & size
  const posField = el('div', { class: 'field' }, [
    el('label', { class: 'field-label' }, 'Position & Size (px)')
  ]);
  posField.appendChild(makeNumGrid([
    { label: 'X', val: c.x, on: v => { c.x = v; renderComponents(); } },
    { label: 'Y', val: c.y, on: v => { c.y = v; renderComponents(); } },
    { label: 'W', val: c.w, on: v => { c.w = Math.max(10, v); renderComponents(); } },
    { label: 'H', val: c.h, on: v => { c.h = Math.max(10, v); renderComponents(); } }
  ]));
  wrap.appendChild(posField);

  // Shape
  wrap.appendChild(makeSelectField('Shape', c.shape || def.shape || 'square',
    [['square','Square'],['circle','Circle'],['pill','Pill'],['region','Region']],
    v => { c.shape = v; renderComponents(); }));

  // Colors
  const colorRow = el('div', { class: 'field' }, [
    el('label', { class: 'field-label' }, 'Border color / fill')

  colorRow.appendChild(el('div', { class: 'field-row' }, [
    el('input', { type: 'color', value: c.color || '#ffffff', class: 'input-text', style: 'height:30px; padding:2px;',
      oninput: e => { c.color = e.target.value; renderComponents(); } }),
    el('input', { type: 'text', class: 'input-text', value: c.bg || '',
      placeholder: 'rgba() or #hex (bg)',
      onchange: e => { c.bg = e.target.value; renderComponents(); } })
  ]));
  wrap.appendChild(colorRow);

  // Mouse behavior section
  wrap.appendChild(el('div', { class: 'section-title', style: 'margin-top:18px;' }, 'Mouse behavior'));

  const miCheck = el('label', { class: 'checkbox' }, [
    el('input', { type: 'checkbox',
      ...(c.mouseIgnore ? { checked: 'checked' } : {}),
      onchange: e => { c.mouseIgnore = e.target.checked; renderComponents(); }
    }),
    'Ignore mouse input'
  ]);
  wrap.appendChild(miCheck);
  wrap.appendChild(el('div', {
    style: 'font-size: 10px; color: var(--text-mute); margin-top: 4px; line-height: 1.5;'
  }, '체크 시 트랙패드 모드 마우스 조작이 이 컴포넌트를 통과하지 않습니다 (터치만 허용).'));

  // Locked
  wrap.appendChild(el('div', { class: 'field', style: 'margin-top:12px;' }, [
    el('label', { class: 'checkbox' }, [
      el('input', { type: 'checkbox',
        ...(c.locked ? { checked: 'checked' } : {}),
        onchange: e => { c.locked = e.target.checked; renderAll(); }
      }),
      'Lock position & size'
    ])
  ]));

  // Runtime advanced settings are rendered above by component type.

  // Actions
  wrap.appendChild(el('div', { style: 'display:flex; gap:6px; margin-top:14px;' }, [
    el('button', {
      class: 'tb-btn',
      style: 'flex:1; justify-content:center;',
      onclick: () => duplicateSelected()
    }, '⎘ Duplicate'),
    el('button', {
      class: 'tb-btn danger',
      style: 'flex:1; justify-content:center;',
      onclick: () => deleteSelected()
    }, '✕ Delete')
  ]));

  insp.appendChild(wrap);
}
