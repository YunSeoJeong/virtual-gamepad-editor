      }, 'Load File…');
      $('.modal-actions').insertBefore(btn, $('#modal-cancel'));
    }
    $('#modal-load-file').style.display = 'inline-flex';
  } else if ($('#modal-load-file')) {
    $('#modal-load-file').style.display = 'none';
  }
  openEditorModal($('#modal'));
}

/* ---------- Serialize / Deserialize ---------- */
function serializeProject() {
  return {
    version: SCHEMA_VERSION,
    meta: { ...state.meta, version: SCHEMA_VERSION },
    // Background image is editor-only and intentionally excluded from exported JSON.
    resolutions: state.resolutions.map(r => ({
      display: normalizeDisplayTarget(r.display),
      displayTarget: normalizeDisplayTarget(r.display),
      settings: {
        display: normalizeDisplayTarget(r.display),
        displayTarget: normalizeDisplayTarget(r.display)
      },
      width: r.width,
      height: r.height,
      components: [
        ...r.components.map(serializeComponent),
        ...r.mouseRegions.map(serializeMouseRegionAsComponent)
      ],
      // Backward compatibility for older runtimes/editors that still read this array.
      mouseRegions: r.mouseRegions.map(m => ({
        id: m.id,
        name: m.name || '',
        behavior: m.behavior || 'ignore',
        x: m.x, y: m.y, w: m.w, h: m.h,
        rect: { x: m.x, y: m.y, w: m.w, h: m.h },
        runtime: {
          inputType: 'mouse',
          role: 'mouseFilter',
          behavior: m.behavior || 'ignore',
          multiTouch: true,
          touchIdPolicy: 'shared',
          z: m.z || 0
        },
        style: { shape: 'region' },
        editor: { locked: false }
      }))
    }))
  };
}

function serializeComponent(c) {
  normalizeComponentRuntime(c);
  const typeMap = {
    key: { type: 'button', subtype: 'key' },
    combo: { type: 'button', subtype: 'combo' },
    shoulder: { type: 'button', subtype: 'shoulder' }
  };
  const mapped = typeMap[c.type] || { type: c.type, subtype: c.subtype || 'normal' };
  return {
    id: c.id,
    type: mapped.type,
    originalType: c.type,
    subtype: mapped.subtype,
    label: c.label,
    rect: { x: c.x, y: c.y, w: c.w, h: c.h },
    style: {
      shape: c.shape,
      color: c.color || null,
      bg: c.bg || null,
      mouseIgnore: !!c.mouseIgnore
    },
    runtime: normalizeRuntimeForExport(c),
    editor: {
      locked: !!c.locked
    },
    // Legacy flat fields for compatibility.
    inputType: c.inputType,
    binding: c.binding || '',
    x: c.x, y: c.y, w: c.w, h: c.h,
    shape: c.shape,
    color: c.color || null,
    bg: c.bg || null,
    mouseIgnore: !!c.mouseIgnore,
    locked: !!c.locked
  };
}

function normalizeRuntimeForExport(c) {
  const rt = JSON.parse(JSON.stringify(c.runtime || {}));
  if (c.type === 'stick') {
    rt.deadzone = parseFloat(c.deadzone ?? rt.deadzone ?? 0.15);
    rt.fixed = c.fixed !== false;
  }
  if (c.type === 'trigger') {
    rt.analog = c.analog !== false && c.inputType !== 'keyboard';
  }
  if (typeof rt.range === 'string') {
    rt.range = rt.range.split(',').map(x => parseFloat(x.trim())).filter(n => Number.isFinite(n));
  }
  if (rt.binding && Array.isArray(rt.binding.keys) === false && typeof rt.binding.keys === 'string') {
    rt.binding.keys = splitBindingList(rt.binding.keys);
  }
  if (c.type === 'mouseScroll') {
    rt.inputType = 'mouse';
    rt.role = 'mouseScroll';
    rt.direction = rt.direction || 'vertical';
    rt.step = parseFloat(rt.step ?? 120) || 120;
    rt.sensitivity = parseFloat(rt.sensitivity ?? 1) || 1;
    rt.invert = !!rt.invert;
    rt.momentum = !!rt.momentum;
  }
  if (c.type === 'touchpad' && c.inputType === 'controller' && rt.mode === 'analogStick') {
    rt.inputType = 'controller';
    rt.role = 'analogStick';
    rt.range = parseNumberRange(rt.range, [-1, 1]);
    rt.deadzone = Number.isFinite(parseFloat(rt.deadzone)) ? parseFloat(rt.deadzone) : 0.15;
    rt.maxDelta = Number.isFinite(parseFloat(rt.maxDelta ?? rt.radius)) ? parseFloat(rt.maxDelta ?? rt.radius) : 24;
    rt.sensitivity = Number.isFinite(parseFloat(rt.sensitivity)) ? parseFloat(rt.sensitivity) : 1;
    rt.invertY = !!rt.invertY;
    delete rt.radius;
    delete rt.origin;
    delete rt.recenterOnRelease;
    delete rt.zeroOnRelease;
    delete rt.clamp;
    if (!touchpadBindingMatchesMode(rt.binding, 'controller', 'analogStick')) {
      rt.binding = defaultTouchpadBinding('controller', 'analogStick');
    }
  }
  return rt;
}

function serializeMouseRegionAsComponent(m) {
  return {
    id: m.id,
    type: 'region',
    originalType: 'mouseRegion',
    subtype: 'mouseFilter',
    label: m.name || 'Mouse Region',
    rect: { x: m.x, y: m.y, w: m.w, h: m.h },
    style: { shape: 'region', color: null, bg: null, mouseIgnore: false },
    runtime: {
      inputType: 'mouse',
      role: 'mouseFilter',
      behavior: m.behavior || 'ignore',
      multiTouch: true,
      touchIdPolicy: 'shared',
      z: m.z || 0
    },
    editor: { locked: false },
    x: m.x, y: m.y, w: m.w, h: m.h
  };
}

function loadProject(data) {
  if (!data || !data.resolutions || !Array.isArray(data.resolutions)) {
    throw new Error('해상도 정보가 없습니다');
  }
  state.meta = data.meta || { name: '', description: '', version: SCHEMA_VERSION };
  // Background images are editor-only. Ignore legacy backgroundImage fields on import.
  state.bgImage = null;
  state.resolutions = data.resolutions.map(r => {
    const res = {
      id: newId('res'),
      display: normalizeDisplayTarget(r.display || r.displayTarget || r.settings?.display || r.settings?.displayTarget),
      width: r.width,
      height: r.height,
      components: [],
      mouseRegions: []
    };
    (r.components || []).forEach(raw => {
      if (raw.originalType === 'mouseRegion' || raw.subtype === 'mouseFilter' || raw.runtime?.role === 'mouseFilter') {
        res.mouseRegions.push(normalizeMouseRegionForImport(raw));
      } else {
        res.components.push(normalizeComponentForImport(raw));
      }
    });
    (r.mouseRegions || []).forEach(raw => {
      if (!res.mouseRegions.some(x => x.id === raw.id)) res.mouseRegions.push(normalizeMouseRegionForImport(raw));
    });
    return res;
  });
  state.activeResId = state.resolutions[0]?.id || null;
  state.selectedIds = [];
  state.panX = 0;
  state.panY = 0;
  state.autoFit = true;
  renderAll();
  requestAnimationFrame(fitZoom);
}

function normalizeComponentForImport(raw) {
  const rect = raw.rect || { x: raw.x ?? 0, y: raw.y ?? 0, w: raw.w ?? 80, h: raw.h ?? 80 };
  const style = raw.style || {};
  const originalType = raw.originalType || (raw.type === 'button' && raw.subtype && raw.subtype !== 'normal' ? raw.subtype : raw.type);
  const type = COMPONENT_TYPES[originalType] ? originalType : (COMPONENT_TYPES[raw.type] ? raw.type : 'button');
  const c = {
    id: raw.id || newId('c'),
    type,
    subtype: raw.subtype || 'normal',
    label: raw.label || COMPONENT_TYPES[type]?.defaultLabel || '',
    inputType: raw.inputType || raw.runtime?.inputType || COMPONENT_TYPES[type]?.inputType || 'controller',
    binding: raw.binding || '',
    x: rect.x, y: rect.y, w: rect.w, h: rect.h,
    shape: style.shape || raw.shape || COMPONENT_TYPES[type]?.shape || 'square',
    color: style.color || raw.color || '',
    bg: style.bg || raw.bg || '',
    mouseIgnore: style.mouseIgnore ?? raw.mouseIgnore ?? false,
    locked: raw.editor?.locked ?? raw.locked ?? false,
    runtime: JSON.parse(JSON.stringify(raw.runtime || {})),
    z: raw.runtime?.z || raw.z || 0
  };
  if (type === 'stick') { c.deadzone = raw.runtime?.deadzone ?? raw.deadzone ?? 0.15; c.fixed = raw.runtime?.fixed ?? raw.fixed ?? true; }
  if (type === 'trigger') { c.analog = raw.runtime?.analog ?? raw.analog ?? true; }
  normalizeComponentRuntime(c);
  return c;
}

function normalizeMouseRegionForImport(raw) {
  const rect = raw.rect || { x: raw.x ?? 0, y: raw.y ?? 0, w: raw.w ?? 200, h: raw.h ?? 200 };
  return {
    id: raw.id || newId('mr'),
    name: raw.name || raw.label || 'Mouse Region',
    behavior: raw.behavior || raw.runtime?.behavior || 'ignore',
    x: rect.x, y: rect.y, w: rect.w, h: rect.h,
    z: raw.runtime?.z || raw.z || 0
  };
}

/* ---------- Alignment & distribution ---------- */
function bindAlignButtons() {
  const sel = () => {
    const all = [...getActiveComponents(), ...getActiveMouseRegions()];
    return all.filter(o => state.selectedIds.includes(o.id) && !o.locked);
  };

  $('#align-l').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const minX = Math.min(...items.map(i => i.x));
    items.forEach(i => i.x = minX);
    renderAll();
  };
  $('#align-r').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const maxR = Math.max(...items.map(i => i.x + i.w));
    items.forEach(i => i.x = maxR - i.w);
    renderAll();
  };
  $('#align-t').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const minY = Math.min(...items.map(i => i.y));
    items.forEach(i => i.y = minY);
    renderAll();
  };
  $('#align-b').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const maxB = Math.max(...items.map(i => i.y + i.h));
    items.forEach(i => i.y = maxB - i.h);
    renderAll();
  };
  $('#align-cx').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const cx = items.reduce((s, i) => s + i.x + i.w / 2, 0) / items.length;
    items.forEach(i => i.x = Math.round(cx - i.w / 2));
    renderAll();
  };
  $('#align-cy').onclick = () => {
    const items = sel(); if (items.length < 2) return;
    const cy = items.reduce((s, i) => s + i.y + i.h / 2, 0) / items.length;
    items.forEach(i => i.y = Math.round(cy - i.h / 2));
    renderAll();
  };
  $('#dist-h').onclick = () => {
    const items = sel(); if (items.length < 3) return;
    items.sort((a, b) => a.x - b.x);
    const left = items[0].x;
    const right = items[items.length - 1].x + items[items.length - 1].w;
    const totalW = items.reduce((s, i) => s + i.w, 0);
    const gap = (right - left - totalW) / (items.length - 1);
    let cur = left;
    items.forEach(i => { i.x = Math.round(cur); cur += i.w + gap; });
    renderAll();
  };
  $('#dist-v').onclick = () => {
    const items = sel(); if (items.length < 3) return;
    items.sort((a, b) => a.y - b.y);
    const top = items[0].y;
    const bot = items[items.length - 1].y + items[items.length - 1].h;
    const totalH = items.reduce((s, i) => s + i.h, 0);
    const gap = (bot - top - totalH) / (items.length - 1);
    let cur = top;
    items.forEach(i => { i.y = Math.round(cur); cur += i.h + gap; });
    renderAll();
  };
}

/* ---------- Keyboard shortcuts ---------- */
function bindKeyboard() {
  document.addEventListener('keydown', e => {
    if (getOpenModal()) return;
    const active = document.activeElement;
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(active?.tagName) || active?.isContentEditable) return;

    if (e.code === 'Space' && !e.repeat && !e.target.closest('button, [role="button"]')) {
      e.preventDefault();
      spacePanActive = true;
      updatePanModeVisuals();
      return;
    }

    if (e.altKey && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
      e.preventDefault();
      const step = e.shiftKey ? 80 : 24;
      const dx = e.key === 'ArrowLeft' ? step : e.key === 'ArrowRight' ? -step : 0;
      const dy = e.key === 'ArrowUp' ? step : e.key === 'ArrowDown' ? -step : 0;
      panCanvasBy(dx, dy);
      return;
    }

    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (state.selectedIds.length) { e.preventDefault(); deleteSelected(); }
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
      e.preventDefault(); duplicateSelected();
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
      e.preventDefault();
      state.selectedIds = [...getActiveComponents().map(c => c.id), ...getActiveMouseRegions().map(m => m.id)];
      renderAll();
    } else if (e.key === 'Escape') {
      if (state.panMode) {
        setPanMode(false);
        return;
      }
      clearPendingPalette();
      state.selectedIds = []; renderAll();
    } else if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key) && state.selectedIds.length) {
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
      const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
      moveSelected(dx, dy);
      renderAll();
    } else if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key) &&
               (state.panMode || active === $('#canvas-wrap'))) {
      e.preventDefault();
      const step = e.shiftKey ? 80 : 24;
      const dx = e.key === 'ArrowLeft' ? step : e.key === 'ArrowRight' ? -step : 0;
      const dy = e.key === 'ArrowUp' ? step : e.key === 'ArrowDown' ? -step : 0;
      panCanvasBy(dx, dy);
    } else if ((e.ctrlKey || e.metaKey) && e.key === '0') {
      e.preventDefault();
      fitZoom();
    } else if (e.key === '+' || e.key === '=') {
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(state.zoom * 1.2); }
    } else if (e.key === '-') {
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(state.zoom / 1.2); }
    }
  });

  document.addEventListener('keyup', e => {
    if (e.code !== 'Space' || !spacePanActive) return;
    spacePanActive = false;
    updatePanModeVisuals();
  });

  window.addEventListener('blur', () => {
    if (!spacePanActive) return;
    spacePanActive = false;
    updatePanModeVisuals();
  });
}

/* ---------- Boot ---------- */
window.addEventListener('DOMContentLoaded', () => {
  init();
  setTimeout(fitZoom, 100);
});

let resizeFitTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeFitTimer);
  resizeFitTimer = setTimeout(() => {
    if (state.autoFit) fitZoom();
    else constrainCanvasPan();
  }, 120);
});
</script>
